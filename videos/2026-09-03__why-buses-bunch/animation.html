<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why buses bunch up in twos and threes</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP_MARGIN = 160, BOT_MARGIN = 160; // Margin from top/bottom for action area
var TOP = TOP_MARGIN, BOT = H - BOT_MARGIN;
var GROUND_Y = BOT - 40; // Y coordinate for stick figure feet and bus wheels

var BUS_STOP_X = CX - 300;
var BUS_STOP_Y = GROUND_Y - 100; // Base of the bus stop pole

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey
var BLUE  = "#4C86F0";              // signal blue  -> the system / bus flow
var AMBER = "#F2A93B";              // warm amber   -> YOU / passengers
var CORAL = "#FF5B5B";              // coral red    -> frustration / naive model

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
// function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); } // Not used

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op, fill) {
  fill = fill == null ? "none" : fill;
  return '<path d="' + d + '" fill="' + fill + '" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}

// Stick figure helper
// x, y are base of feet
// pose: 'patient', 'impatient', 'shrug', 'hands_on_hips', 'knowing', 'running', 'frustrated_shrug'
function stickFigure(x, y, col, pose, op) {
  op = (op == null ? 1 : op);
  var headR = 15;
  var bodyH = 80;
  var legH = 60;
  var armH = 50;
  var headY = y - legH - bodyH - headR;
  var bodyTopY = y - legH - bodyH;
  var bodyBotY = y - legH;
  var legSplitX = 10;
  var armSplitY = bodyTopY + 20;

  var g = '<g opacity="' + op + '">';
  g += dot(x, headY, headR, col); // Head
  g += line(x, bodyTopY, x, bodyBotY, col, 7); // Body

  // Legs
  g += line(x - legSplitX, bodyBotY, x - legSplitX, y, col, 7);
  g += line(x + legSplitX, bodyBotY, x + legSplitX, y, col, 7);

  // Arms based on pose
  if (pose === 'patient') {
    g += line(x - 15, armSplitY, x - 25, armSplitY + armH, col, 7);
    g += line(x + 15, armSplitY, x + 25, armSplitY + armH, col, 7);
  } else if (pose === 'impatient') {
    g += line(x - 15, armSplitY, x - 25, armSplitY + armH, col, 7);
    g += line(x + 15, armSplitY, x + 15 + 20, armSplitY + 20, col, 7); // bent arm
    g += line(x + 15 + 20, armSplitY + 20, x + 15 + 10, armSplitY + 20 + 20, col, 7); // hand on hip
  } else if (pose === 'shrug') {
    g += line(x - 15, armSplitY, x - 15 - 30, armSplitY - 20, col, 7);
    g += line(x + 15, armSplitY, x + 15 + 30, armSplitY - 20, col, 7);
  } else if (pose === 'hands_on_hips') {
    g += line(x - 15, armSplitY, x - 15 - 20, armSplitY + 20, col, 7);
    g += line(x - 15 - 20, armSplitY + 20, x - 15 - 10, armSplitY + 20 + 20, col, 7);
    g += line(x + 15, armSplitY, x + 15 + 20, armSplitY + 20, col, 7);
    g += line(x + 15 + 20, armSplitY + 20, x + 15 + 10, armSplitY + 20 + 20, col, 7);
  } else if (pose === 'knowing') {
    g += line(x - 15, armSplitY + 20, x + 15, armSplitY + 20, col, 7); // crossed arms
  } else if (pose === 'running') {
    g += line(x - 15, armSplitY, x - 15 - 20, armSplitY - 20, col, 7);
    g += line(x + 15, armSplitY, x + 15 + 20, armSplitY + 20, col, 7);
    g += line(x - legSplitX, bodyBotY, x - legSplitX - 10, y - 20, col, 7); // one leg bent
    g += line(x + legSplitX, bodyBotY, x + legSplitX + 10, y, col, 7); // other leg straight
  } else if (pose === 'frustrated_shrug') {
    g += line(x - 15, armSplitY, x - 15 - 30, armSplitY - 20, col, 7);
    g += line(x + 15, armSplitY, x + 15 + 30, armSplitY - 20, col, 7);
    g += line(x, headY, x - 10, headY - 10, col, 7); // tilted head
  }
  g += '</g>';
  return g;
}

// Bus helper
// x, y are center of bus body
function bus(x, y, col, outline_only, doors_open, op, passengers) {
  op = (op == null ? 1 : op);
  var busW = 200, busH = 100;
  var wheelR = 18;
  var doorW = 30;

  var g = '<g opacity="' + op + '">';

  if (outline_only) {
    if (doors_open) {
      g += rrectStroke(x - doorW/2 - (busW - doorW)/4, y, (busW - doorW)/2, busH, 15, col, 7, op);
      g += rrectStroke(x + doorW/2 + (busW - doorW)/4, y, (busW - doorW)/2, busH, 15, col, 7, op);
    } else {
      g += rrectStroke(x, y, busW, busH, 15, col, 7, op);
    }
  } else {
    if (doors_open) {
      g += rrect(x - doorW/2 - (busW - doorW)/4, y, (busW - doorW)/2, busH, 15, col, op);
      g += rrect(x + doorW/2 + (busW - doorW)/4, y, (busW - doorW)/2, busH, 15, col, op);
    } else {
      g += rrect(x, y, busW, busH, 15, col, op);
    }
  }

  g += dot(x - busW / 2 + 30, y + busH / 2 - 10, wheelR, WHITE); // Front wheel
  g += dot(x + busW / 2 - 30, y + busH / 2 - 10, wheelR, WHITE); // Back wheel

  // Passengers inside bus
  if (passengers && passengers.length > 0) {
    var passengerHeadR = 8;
    for (var i = 0; i < passengers.length; i++) {
      var px = x - busW/2 + 30 + (i % 3) * 40 + rnd(i*10)*10;
      var py = y - 20 + Math.floor(i / 3) * 20 + rnd(i*20)*5;
      g += dot(px, py, AMBER, op); // Passengers are always amber
    }
  }

  g += '</g>';
  return g;
}

// Clock helper
// x, y are center, r is radius. u is local time [0,1] for animation.
// broken: if true, draws a broken clock.
function clock(x, y, r, u, col, op, broken) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  g += ring(x, y, r, col, 5);
  g += dot(x, y, 5, col);

  if (broken) {
    g += line(x, y, x + r * 0.4 * Math.cos(Math.PI * 0.2), y + r * 0.4 * Math.sin(Math.PI * 0.2), col, 5);
    g += line(x, y, x + r * 0.7 * Math.cos(Math.PI * 1.3), y + r * 0.7 * Math.sin(Math.PI * 1.3), col, 5);
  } else {
    // Simulate slow time passing: minute hand moves 120 degrees over 10s. Hour hand moves 10 degrees.
    var minuteAngle = lerp(-Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 0.2, u); // 120 degrees = 20 minutes
    var hourAngle = lerp(-Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (0.2 / 12), u); // 1/12 of minute hand movement

    g += line(x, y, x + r * 0.4 * Math.cos(hourAngle), y + r * 0.4 * Math.sin(hourAngle), col, 5);
    g += line(x, y, x + r * 0.7 * Math.cos(minuteAngle), y + r * 0.7 * Math.sin(minuteAngle), col, 5);
  }
  g += '</g>';
  return g;
}

// Bus stop pole
function busStop(x, y, col, op) {
  op = (op == null ? 1 : op);
  var poleH = 150;
  var signW = 80, signH = 30;
  var g = '<g opacity="' + op + '">';
  g += line(x, y, x, y - poleH, col, 8); // Pole
  g += rrect(x + signW/2 + 5, y - poleH + 10, signW, signH, 8, col); // Sign
  g += '</g>';
  return g;
}

// Thought bubble helper
// x, y are approximate center of the bubble.
// type: 'question', 'broken_clock', 'gears'
function thoughtBubble(x, y, type, col, op) {
  op = (op == null ? 1 : op);
  var bubbleW = 180, bubbleH = 120;
  var bubblePath = "M " + (x - bubbleW/2) + " " + y +
                   " Q " + (x - bubbleW/2 - 30) + " " + (y - bubbleH/2) + " " + x + " " + (y - bubbleH) +
                   " Q " + (x + bubbleW/2 + 30) + " " + (y - bubbleH/2) + " " + (x + bubbleW/2) + " " + y +
                   " Q " + (x + bubbleW/2 + 10) + " " + (y + bubbleH/4) + " " + (x + bubbleW/2 - 40) + " " + (y + bubbleH/4 + 20) +
                   " Q " + (x + bubbleW/2 - 60) + " " + (y + bubbleH/4 + 30) + " " + (x + bubbleW/2 - 80) + " " + (y + bubbleH/4 + 10) +
                   " Z";
  var g = '<g opacity="' + op + '">';
  g += pathTag(bubblePath, col, 6, op, "none");

  if (type === 'question') {
    g += line(x, y - bubbleH * 0.6, x, y - bubbleH * 0.3, col, 10);
    g += dot(x, y - bubbleH * 0.1, 10, col);
  } else if (type === 'broken_clock') {
    g += clock(x, y - bubbleH * 0.4, 30, 0, col, 1, true);
  } else if (type === 'gears') {
    var gearR1 = 30, gearR2 = 25;
    var gearX1 = x - 20, gearY1 = y - bubbleH * 0.4 - 10;
    var gearX2 = x + 20, gearY2 = y - bubbleH * 0.4 + 10;
    g += ring(gearX1, gearY1, gearR1, col, 5);
    g += ring(gearX2, gearY2, gearR2, col, 5);
    // Add some teeth
    for (var i = 0; i < 8; i++) {
        var angle = i * Math.PI / 4;
        g += line(gearX1 + gearR1 * Math.cos(angle), gearY1 + gearR1 * Math.sin(angle),
                  gearX1 + (gearR1 + 10) * Math.cos(angle), gearY1 + (gearR1 + 10) * Math.sin(angle), col, 5);
        var angle2 = i * Math.PI / 4 + Math.PI / 8; // Offset for second gear
        g += line(gearX2 + gearR2 * Math.cos(angle2), gearY2 + gearR2 * Math.sin(angle2),
                  gearX2 + (gearR2 + 8) * Math.cos(angle2), gearY2 + (gearR2 + 8) * Math.sin(angle2), col, 5);
    }
  }
  g += '</g>';
  return g;
}

function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';

  s += busStop(BUS_STOP_X, BUS_STOP_Y, WHITE);
  s += stickFigure(BUS_STOP_X + 60, GROUND_Y, AMBER, 'patient');
  s += clock(BUS_STOP_X + 200, BUS_STOP_Y - 50, 40, u * 0.1, WHITE); // Clock ticks very slowly

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var scale = lerp(1.0, 0.95, smooth(u));
  var panX = lerp(0, -50, smooth(u)); // Pan to accommodate crowd
  s += '<g ' + camera(scale, panX, 0) + '>';

  s += busStop(BUS_STOP_X, BUS_STOP_Y, WHITE);
  s += stickFigure(BUS_STOP_X + 60, GROUND_Y, AMBER, 'patient'); // YOU remains patient

  // Clock ticks faster, showing more time passed
  s += clock(BUS_STOP_X + 200, BUS_STOP_Y - 50, 40, u * 0.5, WHITE);

  // Growing crowd
  var numFigures = Math.floor(lerp(0, 8, easeOut(u)));
  for (var i = 0; i < numFigures; i++) {
    var figX = BUS_STOP_X + 60 + 40 + (i % 3) * 40 + rnd(i) * 10;
    var figY = GROUND_Y + (Math.floor(i / 3) % 2) * 10 - rnd(i + 1) * 5;
    s += stickFigure(figX, figY, AMBER, 'impatient', lerp(0.5, 1, ramp(u, (i / numFigures), (i / numFigures) + 0.3)));
  }

  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH */
function scene3(u) {
  var s = '';
  var scale = lerp(0.95, 0.9, smooth(u)); // Zoom out slightly
  var panX = lerp(-50, -80, smooth(u));
  s += '<g ' + camera(scale, panX, 0) + '>';

  s += busStop(BUS_STOP_X, BUS_STOP_Y, WHITE);
  s += stickFigure(BUS_STOP_X + 60, GROUND_Y, AMBER, 'frustrated_shrug'); // YOU is frustrated

  // Crowd showing frustration
  var numFigures = 8;
  for (var i = 0; i < numFigures; i++) {
    var figX = BUS_STOP_X + 60 + 40 + (i % 3) * 40 + rnd(i) * 10;
    var figY = GROUND_Y + (Math.floor(i / 3) % 2) * 10 - rnd(i + 1) * 5;
    var pose = (i % 2 === 0) ? 'shrug' : 'hands_on_hips';
    s += stickFigure(figX, figY, AMBER, pose);
  }

  // Thought bubble appears
  var bubbleOp = ramp(u, 0.2, 0.6);
  s += thoughtBubble(BUS_STOP_X + 180, BUS_STOP_Y - 200, 'broken_clock', CORAL, bubbleOp);

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND */
function scene4(u) {
  var s = '';
  var scale = 0.9;
  var panX = -80;
  s += '<g ' + camera(scale, panX, 0) + '>';

  s += busStop(BUS_STOP_X, BUS_STOP_Y, WHITE);

  // Crowd at the bus stop
  var numFigures = 8;
  var crowdXOffset = lerp(0, -60, ramp(u, 0.4, 0.7)); // Crowd shifts as bus approaches
  for (var i = 0; i < numFigures; i++) {
    var figX = BUS_STOP_X + 60 + 40 + (i % 3) * 40 + rnd(i) * 10 + crowdXOffset;
    var figY = GROUND_Y + (Math.floor(i / 3) % 2) * 10 - rnd(i + 1) * 5;
    s += stickFigure(figX, figY, AMBER, 'impatient');
  }

  // Bus approaches
  var busStartX = W + 100;
  var busStopX = BUS_STOP_X + 280;
  var busX = lerp(busStartX, busStopX, easeOut(ramp(u, 0.0, 0.4)));
  var doorsOpen = u > 0.4 && u < 0.7;
  var doorCloseProg = ramp(u, 0.7, 0.9);
  var busMovingAwayX = lerp(busStopX, BUS_STOP_X - 200, easeIn(ramp(u, 0.8, 1.0)));
  var currentBusX = lerp(busX, busMovingAwayX, ramp(u, 0.7, 1.0));

  var passengersInBus = Math.floor(lerp(0, 6, ramp(u, 0.5, 0.8)));

  s += bus(currentBusX, GROUND_Y - 50, BLUE, true, doorsOpen && doorCloseProg < 0.5, 1, Array(passengersInBus).fill(0));

  // Stick figures rushing into the bus
  var rushCount = Math.floor(lerp(0, 5, ramp(u, 0.4, 0.6)));
  for (var j = 0; j < rushCount; j++) {
    var rushProg = ramp(u, 0.4 + j * 0.05, 0.6 + j * 0.05);
    var rushX = lerp(BUS_STOP_X + 100 + rnd(j) * 50, currentBusX + 80, easeIn(rushProg));
    var rushY = lerp(GROUND_Y, GROUND_Y - 20, Math.sin(rushProg * Math.PI));
    s += stickFigure(rushX, rushY, AMBER, 'running', 1 - rushProg);
  }

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE */
function scene5(u) {
  var s = '';
  var scale = lerp(0.9, 0.8, smooth(u)); // Zoom out more
  var panX = lerp(-80, -100, smooth(u));
  s += '<g ' + camera(scale, panX, 0) + '>';

  // First bus (solid blue, moving slowly)
  var bus1X = lerp(BUS_STOP_X - 200, CX - 300, smooth(u));
  s += bus(bus1X, GROUND_Y - 50, BLUE, false, false, 1, Array(7).fill(0));

  // Second bus appears and catches up
  var bus2StartX = W + 100;
  var bus2TargetX = bus1X + 250; // Catch up to be 250px behind bus1
  var bus2X = lerp(bus2StartX, bus2TargetX, easeOut(ramp(u, 0.1, 0.7)));
  s += bus(bus2X, GROUND_Y - 50, BLUE, true, false, 1, Array(3).fill(0));

  // Road lines to emphasize motion
  var lineSpeed1 = u * 100;
  var lineSpeed2 = u * 200;
  for (var i = 0; i < 10; i++) {
    var y1 = (GROUND_Y + 100 - (lineSpeed1 + rnd(i) * 50) % 200);
    var y2 = (GROUND_Y + 100 - (lineSpeed2 + rnd(i + 10) * 50) % 200);
    s += line(bus1X - 100, y1, bus1X + 100, y1, WHITE, 4, 0.3);
    s += line(bus2X - 100, y2, bus2X + 100, y2, WHITE, 4, 0.3);
  }

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE */
function scene6(u) {
  var s = '';
  var scale = lerp(0.8, 1.0, smooth(u));
  var panX = lerp(-100, 0, smooth(u));
  s += '<g ' + camera(scale, panX, 0) + '>';

  s += busStop(BUS_STOP_X, BUS_STOP_Y, WHITE);
  s += stickFigure(BUS_STOP_X + 60, GROUND_Y, AMBER, 'knowing'); // YOU has a knowing look

  // Multiple buses arrive simultaneously
  var busArrivalProg = easeOut(ramp(u, 0.1, 0.7));
  var bus1FinalX = BUS_STOP_X + 280;
  var bus2FinalX = BUS_STOP_X + 280 + 220;
  var bus3FinalX = BUS_STOP_X + 280 + 440;

  var bus1X = lerp(CX - 300, bus1FinalX, busArrivalProg);
  var bus2X = lerp(CX - 50, bus2FinalX, busArrivalProg);
  var bus3X = lerp(CX + 200, bus3FinalX, busArrivalProg);

  s += bus(bus1X, GROUND_Y - 50, BLUE, false, false, 1, Array(7).fill(0));
  s += bus(bus2X, GROUND_Y - 50, BLUE, false, false, 1, Array(5).fill(0));
  s += bus(bus3X, GROUND_Y - 50, BLUE, false, false, 1, Array(3).fill(0));

  // Thought bubble transforms
  var bubbleOp = lerp(1, 0, ramp(u, 0.0, 0.2)); // Coral bubble fades out
  s += thoughtBubble(BUS_STOP_X + 180, BUS_STOP_Y - 200, 'broken_clock', CORAL, bubbleOp);

  var newBubbleOp = lerp(0, 1, ramp(u, 0.4, 0.8)); // Blue system bubble fades in
  s += thoughtBubble(BUS_STOP_X + 180, BUS_STOP_Y - 200, 'gears', BLUE, newBubbleOp);

  s += '</g>';
  return s;
}


var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
