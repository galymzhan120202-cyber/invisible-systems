<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why You Get Stuck in a Crowd</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> jam wave / system
var AMBER = "#F2A93B";              // warm amber   -> YOU / your goal
var CORAL = "#FF5B5B";              // coral red    -> blaming others / naive model

var STROKE_WIDTH = 9; // Generous stroke width for figures and main lines

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function arrow(x1, y1, x2, y2, col, sw, op) {
  var headSize = sw * 1.8;
  var angle = Math.atan2(y2 - y1, x2 - x1);
  var x3 = x2 - headSize * Math.cos(angle - Math.PI / 6);
  var y3 = y2 - headSize * Math.sin(angle - Math.PI / 6);
  var x4 = x2 - headSize * Math.cos(angle + Math.PI / 6);
  var y4 = y2 - headSize * Math.sin(angle + Math.PI / 6);
  return line(x1, y1, x2, y2, col, sw, op) + line(x2, y2, x3, y3, col, sw, op) + line(x2, y2, x4, y4, col, sw, op);
}

/* Stick figure: base height ~200px, head radius ~24px */
function stickFigure(x, y, col, pose, op, scale = 1) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '" transform="translate(' + x + ' ' + y + ') scale(' + scale + ')">';
  var headR = 24;
  var bodyLen = 80;
  var armLen = 60;
  var legLen = 70;
  var sw = STROKE_WIDTH;

  // Head
  g += dot(0, -headR - bodyLen / 2, headR, col);

  // Body
  g += line(0, -bodyLen / 2, 0, bodyLen / 2, col, sw);

  // Arms and Legs based on pose
  switch (pose) {
    case 'walk':
      // Right arm back, left arm forward
      g += line(0, -bodyLen / 4, armLen * Math.cos(Math.PI * 0.75), -bodyLen / 4 + armLen * Math.sin(Math.PI * 0.75), col, sw); // Left arm forward
      g += line(0, -bodyLen / 4, armLen * Math.cos(Math.PI * 1.25), -bodyLen / 4 + armLen * Math.sin(Math.PI * 1.25), col, sw); // Right arm back
      // Right leg forward, left leg back
      g += line(0, bodyLen / 2, legLen * Math.cos(Math.PI * 0.1), bodyLen / 2 + legLen * Math.sin(Math.PI * 0.1), col, sw); // Left leg back
      g += line(0, bodyLen / 2, legLen * Math.cos(Math.PI * -0.1), bodyLen / 2 + legLen * Math.sin(Math.PI * -0.1), col, sw); // Right leg forward
      break;
    case 'idle':
      g += line(0, -bodyLen / 4, -armLen * 0.6, armLen * 0.2, col, sw); // Left arm down
      g += line(0, -bodyLen / 4, armLen * 0.6, armLen * 0.2, col, sw); // Right arm down
      g += line(0, bodyLen / 2, -legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Left leg
      g += line(0, bodyLen / 2, legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Right leg
      break;
    case 'struggle':
      g += line(0, -bodyLen / 4, -armLen * 0.8, -armLen * 0.5, col, sw); // Left arm up
      g += line(0, -bodyLen / 4, armLen * 0.8, -armLen * 0.5, col, sw); // Right arm up
      g += line(0, bodyLen / 2, -legLen * 0.1, bodyLen / 2 + legLen * 0.7, col, sw); // Left leg slightly bent
      g += line(0, bodyLen / 2, legLen * 0.1, bodyLen / 2 + legLen * 0.7, col, sw); // Right leg slightly bent
      break;
    case 'lookLeft':
      g += line(0, -bodyLen / 4, -armLen * 0.6, armLen * 0.2, col, sw); // Left arm down
      g += line(0, -bodyLen / 4, armLen * 0.6, armLen * 0.2, col, sw); // Right arm down
      g += line(0, bodyLen / 2, -legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Left leg
      g += line(0, bodyLen / 2, legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Right leg
      g += line(0, -headR - bodyLen / 2, -headR * 0.8, -headR - bodyLen / 2 + headR * 0.5, WHITE, sw * 0.7); // Gaze line
      break;
    case 'lookRight':
      g += line(0, -bodyLen / 4, -armLen * 0.6, armLen * 0.2, col, sw); // Left arm down
      g += line(0, -bodyLen / 4, armLen * 0.6, armLen * 0.2, col, sw); // Right arm down
      g += line(0, bodyLen / 2, -legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Left leg
      g += line(0, bodyLen / 2, legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Right leg
      g += line(0, -headR - bodyLen / 2, headR * 0.8, -headR - bodyLen / 2 + headR * 0.5, WHITE, sw * 0.7); // Gaze line
      break;
    case 'lookUp':
      g += line(0, -bodyLen / 4, -armLen * 0.6, armLen * 0.2, col, sw); // Left arm down
      g += line(0, -bodyLen / 4, armLen * 0.6, armLen * 0.2, col, sw); // Right arm down
      g += line(0, bodyLen / 2, -legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Left leg
      g += line(0, bodyLen / 2, legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw); // Right leg
      g += line(0, -headR - bodyLen / 2, 0, -headR - bodyLen / 2 - headR * 0.8, WHITE, sw * 0.7); // Gaze line
      break;
    default: // default to idle
      g += line(0, -bodyLen / 4, -armLen * 0.6, armLen * 0.2, col, sw);
      g += line(0, -bodyLen / 4, armLen * 0.6, armLen * 0.2, col, sw);
      g += line(0, bodyLen / 2, -legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw);
      g += line(0, bodyLen / 2, legLen * 0.2, bodyLen / 2 + legLen * 0.8, col, sw);
      break;
  }
  g += '</g>';
  return g;
}

/* Simple crowd dot with optional motion blur line */
function crowdDot(x, y, r, col, op, motionY = 0) {
  var s = '';
  if (motionY > 0) {
    s += line(x, y - r, x, y - r - motionY, col, STROKE_WIDTH * 0.6, op * 0.7);
  }
  s += dot(x, y, r, col, op);
  return s;
}

/* Persistent background grid/path for the crowd to move on (hero element) */
function crowdPath(op) {
  op = (op == null ? 0.1 : op);
  var pathWidth = W * 0.7; // Main path width
  var pathX = CX;
  return rrect(pathX, (TOP + BOT) / 2, pathWidth, BOT - TOP, 60, BLUE, op);
}

function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + CROWD - Initial state, you moving, crowd flowing. */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';
  s += crowdPath(0.12); // Faint blue background path

  var youX = CX;
  var youY = BOT - 200; // YOU are near the bottom, walking up
  var bob = Math.sin(u * Math.PI * 4) * 8; // Walking bob
  s += stickFigure(youX, youY + bob, AMBER, 'walk', 1);

  // Crowd figures, generally moving upwards
  var numCrowd = 12;
  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.5);
    var crowdY = BOT - 100 - i * 180 - u * 120 + rnd(i + 10) * 60;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100); // Loop figures
    s += crowdDot(crowdX, crowdY, 16, WHITE, 0.9, 30); // White figures with motion blur
  }
  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): DENSITY FLUCTUATION - A small group slows down, creating a ripple. */
function scene2(u) {
  var s = '';
  var shake = Math.sin(u * 42) * 3 * pulse(u, 0.18, 0.14); // Slight shake at beginning of transition
  s += '<g ' + camera(1.0, shake, 0) + '>';
  s += crowdPath(0.12);

  var youX = CX;
  var youY = BOT - 200;
  var bob = Math.sin(u * Math.PI * 3) * 6;
  s += stickFigure(youX, youY + bob, AMBER, 'walk', 1);

  // Crowd figures, some slowing down
  var numCrowd = 12;
  var slowZoneY = lerp(CY - 200, CY + 100, smooth(u)); // Slow zone moves down
  var slowZoneHeight = 300;
  var jamStartOp = ramp(u, 0.6, 0.9); // Jam wave hint opacity

  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.5);
    var crowdY = BOT - 100 - i * 180 - u * 80 + rnd(i + 10) * 60;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100);

    var distToSlowZone = Math.abs(crowdY - slowZoneY);
    var slowFactor = 1 - clamp(distToSlowZone / (slowZoneHeight / 2), 0, 1);
    var motionBlur = lerp(30, 5, slowFactor);
    var crowdColor = lerp(1, 0.5, slowFactor) > 0.7 ? WHITE : DIM; // Dim figures in slow zone

    // You are approaching the slow zone
    if (crowdY > youY - 100 && crowdY < youY + 100) { // Figures near YOU
      motionBlur = 30; // Keep motion blur for figures near YOU, until YOU slow down
      crowdColor = WHITE;
    }
    
    s += crowdDot(crowdX, crowdY, 16, crowdColor, 0.9, motionBlur);
  }

  // Hint of the jam wave (blue rectangle)
  s += rrect(CX, slowZoneY, W * 0.6, slowZoneHeight, 40, BLUE, 0.08 * jamStartOp);
  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): THE JAM FORMS - The wave propagates backward, YOU get caught. */
function scene3(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += crowdPath(0.12);

  var youX = CX;
  var youY = BOT - 200;
  var jamWaveY = lerp(CY + 100, youY + 50, smooth(u)); // Jam wave moves down (backward)
  var jamWaveHeight = lerp(300, 400, smooth(u));
  var youCaught = ramp(u, 0.3, 0.7); // How caught YOU are
  var youPose = youCaught > 0.5 ? 'struggle' : 'walk';
  var youBob = Math.sin(u * Math.PI * 2) * 4 * (1 - youCaught); // Less bob when struggling
  s += stickFigure(youX, youY + youBob, AMBER, youPose, 1);

  // Main jam wave (blue)
  s += rrect(CX, jamWaveY, W * 0.7, jamWaveHeight, 50, BLUE, 0.2 + 0.1 * Math.sin(u * Math.PI * 2));
  s += rrectStroke(CX, jamWaveY, W * 0.7, jamWaveHeight, 50, BLUE, STROKE_WIDTH, 0.5 + 0.3 * Math.sin(u * Math.PI * 2));

  // Crowd figures, some caught in the jam
  var numCrowd = 14;
  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.5);
    var crowdY = BOT - 100 - i * 160 - u * 50 + rnd(i + 10) * 50;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100);

    var distToJam = Math.abs(crowdY - jamWaveY);
    var jamFactor = 1 - clamp(distToJam / (jamWaveHeight / 2), 0, 1);
    var motionBlur = lerp(30, 0, jamFactor); // No motion blur in jam
    var crowdColor = lerp(1, 0.5, jamFactor) > 0.7 ? WHITE : DIM;

    if (crowdY > youY - 100 && crowdY < youY + 100) { // Figures near YOU
      motionBlur = lerp(30, 0, youCaught); // YOU also slow down
      crowdColor = WHITE;
    }

    s += crowdDot(crowdX, crowdY, 16, crowdColor, 0.9, motionBlur);
  }

  // Coral red blame hint (fades in slightly)
  var blameOp = ramp(u, 0.8, 1.0);
  if (blameOp > 0.05) {
      s += ring(youX, youY - 100, 60, CORAL, STROKE_WIDTH * 0.8, blameOp * 0.6);
  }

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): BLAMING OTHERS - YOU look around, seeing others as the problem. */
function scene4(u) {
  var s = '';
  var zoom = lerp(1.0, 1.2, smooth(ramp(u, 0.1, 0.4))); // Slight zoom on YOU
  var panY = lerp(0, -100, smooth(ramp(u, 0.1, 0.4)));
  s += '<g ' + camera(zoom, 0, panY) + '>';
  s += crowdPath(0.12 * (1 - ramp(u, 0.7, 1.0))); // Faint crowd path fades slightly

  var youX = CX;
  var youY = BOT - 200;
  var youPose = 'idle'; // YOU are stuck, looking around
  var lookLeft = ramp(u, 0.3, 0.5);
  var lookRight = ramp(u, 0.5, 0.7);
  if (lookLeft > 0 && lookLeft < 1) youPose = 'lookLeft';
  else if (lookRight > 0 && lookRight < 1) youPose = 'lookRight';
  s += stickFigure(youX, youY, AMBER, youPose, 1);

  // Jam wave is still present, but less prominent
  var jamWaveY = youY + 50;
  var jamWaveHeight = 400;
  s += rrect(CX, jamWaveY, W * 0.7, jamWaveHeight, 50, BLUE, 0.15);

  // Crowd figures, all static/slow, with coral blame highlights
  var numCrowd = 10;
  var blameOpacity = ramp(u, 0.2, 0.6) * (1 - ramp(u, 0.8, 1.0));
  var blameTargetOffset = 180; // Distance from YOU to blamed figures

  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.5);
    var crowdY = BOT - 100 - i * 180 + rnd(i + 10) * 50;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100);

    var distToYou = Math.hypot(crowdX - youX, crowdY - youY);
    var blamePulse = pulse(distToYou, blameTargetOffset, 80); // Figures at specific distance get blamed
    var crowdColor = WHITE;
    var blameColorOp = blameOpacity * blamePulse;

    s += stickFigure(crowdX, crowdY, crowdColor, 'idle', 0.9);
    if (blameColorOp > 0.05) {
      s += ring(crowdX, crowdY - 100, 50, CORAL, STROKE_WIDTH * 0.8, blameColorOp * 0.8);
      s += arrow(youX, youY - 100, crowdX, crowdY - 100, CORAL, STROKE_WIDTH * 0.7, blameColorOp * 0.9);
    }
  }
  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): SYSTEM REVEALED - The blue wave is the true cause, not individuals.*/
function scene5(u) {
  var s = '';
  var zoom = lerp(1.2, 0.9, smooth(u)); // Zoom out to see the system
  var panY = lerp(-100, 0, smooth(u));
  s += '<g ' + camera(zoom, 0, panY) + '>';
  s += crowdPath(0.12);

  var youX = CX;
  var youY = BOT - 200;
  s += stickFigure(youX, youY, AMBER, 'lookUp', 1); // YOU looking up at the system

  // The blue jam wave becomes very prominent and dynamic
  var jamWaveY = CY + Math.sin(u * Math.PI * 2) * 50; // Wave undulates
  var jamWaveHeight = BOT - TOP - 100;
  var jamWaveWidth = W * 0.8;
  var jamOpacity = lerp(0.15, 0.35, smooth(u));
  var jamStrokeOpacity = lerp(0.5, 0.8, smooth(u));

  s += rrect(CX, jamWaveY, jamWaveWidth, jamWaveHeight, 60, BLUE, jamOpacity);
  s += rrectStroke(CX, jamWaveY, jamWaveWidth, jamWaveHeight, 60, BLUE, STROKE_WIDTH * 1.5, jamStrokeOpacity);

  // Internal lines/patterns within the jam wave to show its structure
  for (var j = 0; j < 5; j++) {
    var lineY = jamWaveY - jamWaveHeight / 2 + j * (jamWaveHeight / 4) + u * 30 % (jamWaveHeight / 4);
    s += line(CX - jamWaveWidth / 2 + 50, lineY, CX + jamWaveWidth / 2 - 50, lineY, BLUE, STROKE_WIDTH * 0.8, jamStrokeOpacity * 0.6);
  }

  // Crowd figures, now clearly embedded in the blue wave, no individual blame
  var numCrowd = 16;
  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.6);
    var crowdY = BOT - 100 - i * 140 - u * 30 + rnd(i + 10) * 40;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100);

    var distToJam = Math.abs(crowdY - jamWaveY);
    var jamFactor = 1 - clamp(distToJam / (jamWaveHeight / 2), 0, 1);
    var crowdColor = jamFactor > 0.1 ? DIM : WHITE; // Figures in jam are dimmed
    var motionBlur = lerp(0, 10, 1 - jamFactor); // Slight motion outside jam

    s += crowdDot(crowdX, crowdY, 16, crowdColor, 0.8, motionBlur);
  }
  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): FLOW RESTORED - The jam dissipates, YOU move freely again. */
function scene6(u) {
  var s = '';
  var scale = lerp(0.9, 1.0, smooth(clamp(u / 0.7, 0, 1)));
  var panY = lerp(0, -20, smooth(clamp(u / 0.7, 0, 1)));
  s += '<g ' + camera(scale, 0, panY) + '>';
  s += crowdPath(0.12);

  var youX = CX;
  var youY = BOT - 200;
  var jamDissipate = ramp(u, 0.2, 0.8); // Jam dissipates
  var youSpeedUp = ramp(u, 0.4, 0.9); // YOU speed up
  var youBob = Math.sin(u * Math.PI * 4) * 8 * youSpeedUp;
  var youPose = youSpeedUp > 0.1 ? 'walk' : 'idle';
  s += stickFigure(youX, youY + youBob, AMBER, youPose, 1);

  // The blue jam wave dissipates
  var jamWaveOpacity = lerp(0.35, 0, jamDissipate);
  var jamWaveStrokeOpacity = lerp(0.8, 0, jamDissipate);
  var jamWaveY = CY;
  var jamWaveHeight = BOT - TOP - 100;
  var jamWaveWidth = W * 0.8;

  if (jamWaveOpacity > 0.01) {
    s += rrect(CX, jamWaveY, jamWaveWidth, jamWaveHeight, 60, BLUE, jamWaveOpacity);
    s += rrectStroke(CX, jamWaveY, jamWaveWidth, jamWaveHeight, 60, BLUE, STROKE_WIDTH * 1.5, jamWaveStrokeOpacity);
  }

  // Crowd figures resume normal flow
  var numCrowd = 12;
  for (var i = 0; i < numCrowd; i++) {
    var crowdX = CX + (rnd(i) - 0.5) * (W * 0.5);
    var crowdY = BOT - 100 - i * 180 - u * lerp(30, 120, youSpeedUp) + rnd(i + 10) * 60;
    while (crowdY < TOP) crowdY += (BOT - TOP + 100);

    var motionBlur = lerp(0, 30, youSpeedUp);
    s += crowdDot(crowdX, crowdY, 16, WHITE, 0.9, motionBlur);
  }
  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; } // Ensure final frame is stable at u=1
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
