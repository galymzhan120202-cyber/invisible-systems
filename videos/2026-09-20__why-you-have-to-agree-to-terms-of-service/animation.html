<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why You Must Agree to Terms of Service</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots / TOS document
var BLUE  = "#4C86F0";              // signal blue  -> legal framework, system
var AMBER = "#F2A93B";              // warm amber   -> YOU, user, their desire/rights
var CORAL = "#FF5B5B";              // coral red    -> naive understanding, perceived burden

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op, fill) {
  return '<path d="' + d + '" fill="' + (fill ? fill : 'none') + '" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

// Stick figure helper
function stickFigure(x, y, col, scale, headAngle, armAngle, legAngle, bodyLean, op) {
  scale = scale == null ? 1 : scale;
  headAngle = headAngle == null ? 0 : headAngle; // radians
  armAngle = armAngle == null ? 0 : armAngle;   // radians
  legAngle = legAngle == null ? 0 : legAngle;   // radians
  bodyLean = bodyLean == null ? 0 : bodyLean;   // radians
  op = op == null ? 1 : op;

  var sw = 9 * scale;
  var headR = 28 * scale;
  var bodyH = 100 * scale;
  var armL = 60 * scale;
  var legL = 70 * scale;

  var g = '<g opacity="' + op + '" transform="translate(' + x + ' ' + y + ') rotate(' + (bodyLean * 180 / Math.PI) + ')">';
  
  // Head
  g += dot(0, -headR - bodyH / 2, headR, col);

  // Body
  g += line(0, -bodyH / 2, 0, bodyH / 2, col, sw);

  // Arms
  g += line(0, -bodyH / 2 + sw, Math.cos(armAngle + Math.PI/2) * armL, Math.sin(armAngle + Math.PI/2) * armL - bodyH/2 + sw, col, sw); // Left arm
  g += line(0, -bodyH / 2 + sw, Math.cos(-armAngle + Math.PI/2) * armL, Math.sin(-armAngle + Math.PI/2) * armL - bodyH/2 + sw, col, sw); // Right arm

  // Legs
  g += line(0, bodyH / 2, Math.cos(legAngle + Math.PI/2) * legL, Math.sin(legAngle + Math.PI/2) * legL + bodyH/2, col, sw); // Left leg
  g += line(0, bodyH / 2, Math.cos(-legAngle + Math.PI/2) * legL, Math.sin(-legAngle + Math.PI/2) * legL + bodyH/2, col, sw); // Right leg

  g += '</g>';
  return g;
}

// Simple app icon: a rounded rectangle with a dot inside
function appIcon(x, y, size, col, op) {
  var s = '';
  s += rrectStroke(x, y, size, size, size / 4, col, 8, op);
  s += dot(x, y, size / 8, col, op);
  return s;
}

// "I Agree" button (no text, just a bar)
function agreeButton(x, y, w, h, rad, col, sw, op) {
  var s = '';
  s += rrect(x, y, w, h, rad, DIM, op);
  s += line(x - w / 4, y, x + w / 4, y, WHITE, sw, op); // Simple bar
  return s;
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var scale = lerp(1.0, 1.0, smooth(u * 0.9));
  var driftY = lerp(0, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';

  // App icon appears
  var appScale = ramp(u, 0.0, 0.2);
  var appOpacity = ramp(u, 0.0, 0.2);
  s += appIcon(CX + 180, CY - 100, 120 * appScale, WHITE, appOpacity);

  // Stick figure
  var headAngle = lerp(0, Math.PI / 10, ramp(u, 0.6, 0.8)); // Surprised look
  s += stickFigure(CX - 200, CY + 100, AMBER, 1, headAngle);

  // Document slides up
  var docH = BOT - TOP + 200;
  var docY = lerp(BOT + docH / 2, CY, easeOut(ramp(u, 0.4, 0.9)));
  var docOpacity = ramp(u, 0.4, 0.9);
  s += rrect(CX, docY, W * 0.7, docH, 30, DIM, docOpacity);

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Document is central
  var docH = BOT - TOP + 200;
  s += rrect(CX, CY, W * 0.7, docH, 30, DIM, 1);

  // Stick figure tries to interact
  var armAngle = lerp(0, -Math.PI / 4, ramp(u, 0.1, 0.4));
  var headAngle = lerp(Math.PI / 10, 0, ramp(u, 0.1, 0.4)); // back to neutral
  headAngle = lerp(headAngle, Math.PI / 8, ramp(u, 0.6, 0.8)); // look at button
  s += stickFigure(CX - 200, CY + 100, AMBER, 1, headAngle, armAngle);

  // "I Agree" button appears
  var btnOpacity = ramp(u, 0.5, 0.7);
  var btnScale = lerp(0.5, 1.0, easeOut(ramp(u, 0.5, 0.7)));
  s += '<g transform="translate(' + CX + ' ' + (BOT - 100) + ') scale(' + btnScale + ') translate(' + (-CX) + ' ' + (-(BOT - 100)) + ')">';
  s += agreeButton(CX, BOT - 100, 300, 80, 15, WHITE, 9, btnOpacity);
  s += '</g>';

  // Faint app icon behind document (implied)
  s += appIcon(CX + 180, CY - 100, 120, WHITE, 0.05);

  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH */
function scene3(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Stick figure scrolls rapidly
  var armAngle = lerp(-Math.PI / 4, Math.PI / 2, ramp(u, 0.0, 0.3)); // Scrolling motion
  armAngle = lerp(armAngle, 0, ramp(u, 0.7, 0.9)); // Back to dismissive
  var bodyLean = lerp(0, -Math.PI / 16, ramp(u, 0.0, 0.3)); // Leaning into scroll
  bodyLean = lerp(bodyLean, 0, ramp(u, 0.7, 0.9));
  var headAngle = lerp(Math.PI / 8, -Math.PI / 10, ramp(u, 0.0, 0.3)); // Annoyed look
  headAngle = lerp(headAngle, 0, ramp(u, 0.7, 0.9)); // Dismissive
  s += stickFigure(CX - 200, CY + 100, AMBER, 1, headAngle, armAngle, 0, bodyLean);

  // Document blurs into coral red mass
  var scrollY = lerp(0, -H * 0.8, easeIn(ramp(u, 0.0, 0.6)));
  var docOpacity = lerp(1, 0, ramp(u, 0.6, 0.8));
  var blurOpacity = lerp(0, 1, ramp(u, 0.2, 0.5)) * lerp(1, 0, ramp(u, 0.7, 0.9));
  
  // Grey document fades out
  s += rrect(CX, CY + scrollY, W * 0.7, BOT - TOP + 200, 30, DIM, docOpacity);

  // Coral blur appears
  if (blurOpacity > 0.01) {
    var blurY = CY + scrollY * 0.8;
    // Represent blur as a series of rapidly moving coral lines
    for (var i = 0; i < 8; i++) {
        var lineY = blurY + (i - 4) * 100 + (u * 300 % 200);
        s += line(CX - W * 0.3, lineY, CX + W * 0.3, lineY, CORAL, 10, blurOpacity * 0.6);
    }
    s += rrect(CX, blurY, W * 0.6, BOT - TOP, 30, CORAL, blurOpacity * 0.2); // Faint background glow
  }

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40s): FIND */
function scene4(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Coral blur transforms into signal blue shield
  var blurOpacity = lerp(1, 0, ramp(u, 0.0, 0.3));
  var shieldOpacity = lerp(0, 1, ramp(u, 0.2, 0.5));
  var shieldScale = lerp(0.8, 1.0, easeOut(ramp(u, 0.2, 0.5)));

  if (blurOpacity > 0.01) {
    for (var i = 0; i < 8; i++) {
        var lineY = CY + (i - 4) * 100 + (u * 300 % 200);
        s += line(CX - W * 0.3, lineY, CX + W * 0.3, lineY, CORAL, 10, blurOpacity * 0.6);
    }
    s += rrect(CX, CY, W * 0.6, BOT - TOP, 30, CORAL, blurOpacity * 0.2);
  }

  if (shieldOpacity > 0.01) {
    s += '<g transform="translate(' + CX + ' ' + CY + ') scale(' + shieldScale + ') translate(' + (-CX) + ' ' + (-CY) + ')">';
    s += rrect(CX, CY, W * 0.6, BOT - TOP - 100, 40, BLUE, shieldOpacity * 0.8); // Solid shield
    s += rrectStroke(CX, CY, W * 0.6, BOT - TOP - 100, 40, WHITE, 10, shieldOpacity); // White outline
    s += '</g>';
  }

  // App icon slides into place behind the shield
  var appX = lerp(CX + 250, CX, ramp(u, 0.5, 0.8));
  var appY = CY;
  var appOpacity = ramp(u, 0.5, 0.8);
  s += appIcon(appX, appY, 120, WHITE, appOpacity);

  // Stick figure observes
  s += stickFigure(CX - 200, CY + 100, AMBER, 1);

  // Focus cue on boundary
  var focusPulse = pulse(u, 0.7, 0.15);
  if (focusPulse > 0.01) {
    s += ring(CX, CY, W * 0.3 + 20, BLUE, 8, focusPulse * 0.8);
  }

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50s): TAKE */
function scene5(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Shield transforms into balance scale
  var scaleOpacity = lerp(0, 1, ramp(u, 0.0, 0.3));
  var shieldOpacity = lerp(1, 0, ramp(u, 0.0, 0.3));

  if (shieldOpacity > 0.01) {
    s += rrect(CX, CY, W * 0.6, BOT - TOP - 100, 40, BLUE, shieldOpacity * 0.8);
    s += rrectStroke(CX, CY, W * 0.6, BOT - TOP - 100, 40, WHITE, 10, shieldOpacity);
  }

  if (scaleOpacity > 0.01) {
    var pivotX = CX, pivotY = CY + 200;
    var beamW = 600, beamH = 12;
    var armL = beamW / 2 - 50;
    var armY = pivotY - 150;

    // Scale structure
    s += line(pivotX, pivotY, pivotX, pivotY + 150, WHITE, 10, scaleOpacity); // Base support
    s += line(pivotX - beamW / 2, armY, pivotX + beamW / 2, armY, WHITE, beamH, scaleOpacity); // Beam
    s += line(pivotX, armY - beamH / 2, pivotX, pivotY, WHITE, 10, scaleOpacity); // Pivot rod

    // Left pan (rights)
    var rightsX = pivotX - armL;
    var rightsY = armY + lerp(100, 0, easeOut(ramp(u, 0.4, 0.6)));
    s += rrectStroke(rightsX, rightsY, 120, 80, 10, AMBER, 8, scaleOpacity);
    s += dot(rightsX, rightsY - 10, 15, AMBER, scaleOpacity); // Small head for "rights"
    s += line(rightsX, rightsY + 10, rightsX, rightsY + 30, AMBER, 8, scaleOpacity); // Small body

    // Right pan (access/app)
    var appX = pivotX + armL;
    var appY = armY + lerp(100, 0, easeOut(ramp(u, 0.6, 0.8)));
    s += appIcon(appX, appY, 120, BLUE, scaleOpacity);

    // Balance effect
    var balanceTilt = lerp(0, 0, easeOut(ramp(u, 0.6, 0.8))); // Keep it balanced for clarity
    s += '<g transform="rotate(' + (balanceTilt * 180 / Math.PI) + ' ' + pivotX + ' ' + armY + ')">';
    s += line(pivotX - beamW / 2, armY, pivotX + beamW / 2, armY, WHITE, beamH, scaleOpacity); // Beam
    s += '</g>';
  }

  // Stick figure observes
  s += stickFigure(CX - 200, CY + 100, AMBER, 1);

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60s): RETURN + CHANGE */
function scene6(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Scale disappears
  var scaleOpacity = lerp(1, 0, ramp(u, 0.0, 0.2));
  if (scaleOpacity > 0.01) {
    var pivotX = CX, pivotY = CY + 200;
    var beamW = 600, beamH = 12;
    var armL = beamW / 2 - 50;
    var armY = pivotY - 150;
    s += line(pivotX, pivotY, pivotX, pivotY + 150, WHITE, 10, scaleOpacity);
    s += line(pivotX - beamW / 2, armY, pivotX + beamW / 2, armY, WHITE, beamH, scaleOpacity);
    s += line(pivotX, armY - beamH / 2, pivotX, pivotY, WHITE, 10, scaleOpacity);
    s += rrectStroke(pivotX - armL, armY, 120, 80, 10, AMBER, 8, scaleOpacity);
    s += dot(pivotX - armL, armY - 10, 15, AMBER, scaleOpacity);
    s += line(pivotX - armL, armY + 10, pivotX - armL, armY + 30, AMBER, 8, scaleOpacity);
    s += appIcon(pivotX + armL, armY, 120, BLUE, scaleOpacity);
  }

  // App icon expands and becomes active (amber)
  var appScale = lerp(1, 1.4, easeOut(ramp(u, 0.2, 0.5)));
  var appCol = lerp(0, 1, ramp(u, 0.3, 0.6)) > 0.5 ? AMBER : WHITE; // Morph color to amber
  s += appIcon(CX, CY - 100, 120 * appScale, appCol, 1);

  // Stick figure interacts with app
  var armAngle = lerp(0, -Math.PI / 6, ramp(u, 0.4, 0.7));
  var headAngle = lerp(0, -Math.PI / 16, ramp(u, 0.4, 0.7)); // Looking down at app
  s += stickFigure(CX - 200, CY + 100, AMBER, 1, headAngle, armAngle);

  // Subtle, transparent signal blue layer covers screen
  var overlayOpacity = ramp(u, 0.7, 1.0) * 0.15; // Max 15% opacity
  s += rrect(CX, CY, W, H, 0, BLUE, overlayOpacity);

  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
