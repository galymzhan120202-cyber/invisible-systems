<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Supermarket Carts Are So Big</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> the system / the wave
var AMBER = "#F2A93B";              // warm amber   -> YOU / what you want
var CORAL = "#FF5B5B";              // coral red    -> the naive model / false signal

var DUR = 60;
window.__duration = DUR;

/* Stick figure constants */
var SF_HEAD_R = 30;
var SF_BODY_LEN = 150;
var SF_ARM_LEN = 90;
var SF_LEG_LEN = 120;
var SF_STROKE = 12;

/* Shopping cart constants */
var CART_STROKE = 12;
var CART_WHEEL_R = 24;
var BASE_CART_WIDTH = 280;
var BASE_CART_HEIGHT = 220;
var BASE_CART_HANDLE_HEIGHT = 60;

/* Main actor positions */
var SF_HEAD_Y = CY - 150; // Stick figure head center Y
var SF_FEET_Y = SF_HEAD_Y + SF_HEAD_R + SF_BODY_LEN + SF_LEG_LEN; // Stick figure feet Y
var CART_WHEELS_Y = SF_FEET_Y + 40; // Cart wheels Y (slightly below SF feet)

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}

function stickFigure(cx, cyHead, col, pose, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  g += dot(cx, cyHead, SF_HEAD_R, col); // Head

  var bodyY = cyHead + SF_HEAD_R;
  var bodyBottomY = bodyY + SF_BODY_LEN;
  g += line(cx, bodyY, cx, bodyBottomY, col, SF_STROKE); // Body

  var legY = bodyBottomY;
  var footY = legY + SF_LEG_LEN;
  var legXOffset = 20;
  g += line(cx - legXOffset, legY, cx - legXOffset, footY, col, SF_STROKE); // Left leg
  g += line(cx + legXOffset, legY, cx + legXOffset, footY, col, SF_STROKE); // Right leg

  var armY = bodyY + 20;
  var armXOffset = 20;
  var armAngleL = -45; // Default arm positions
  var armAngleR = 45;

  if (pose === 1) { // Grabbing cart
    armAngleL = -80; armAngleR = -10;
  } else if (pose === 2) { // Pushing cart
    armAngleL = -60; armAngleR = 60;
  } else if (pose === 3) { // Looking into cart
    armAngleL = -100; armAngleR = 100;
  } else if (pose === 4) { // Dropping item
    armAngleL = -90; armAngleR = 0;
  }

  var armLX2 = cx - armXOffset + SF_ARM_LEN * Math.cos(armAngleL * Math.PI / 180);
  var armLY2 = armY + SF_ARM_LEN * Math.sin(armAngleL * Math.PI / 180);
  var armRX2 = cx + armXOffset + SF_ARM_LEN * Math.cos(armAngleR * Math.PI / 180);
  var armRY2 = armY + SF_ARM_LEN * Math.sin(armAngleR * Math.PI / 180);

  g += line(cx - armXOffset, armY, armLX2, armLY2, col, SF_STROKE); // Left arm
  g += line(cx + armXOffset, armY, armRX2, armRY2, col, SF_STROKE); // Right arm

  g += '</g>';
  return g;
}

function shoppingCart(baseX, baseY, cartScale, strokeCol, fillLevel, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';

  var cartWidth = BASE_CART_WIDTH * cartScale;
  var cartHeight = BASE_CART_HEIGHT * cartScale;
  var cartHandleHeight = BASE_CART_HANDLE_HEIGHT * cartScale;
  var cartWheelR = CART_WHEEL_R * cartScale;

  var cartBodyY = baseY - cartHeight - cartWheelR; // Top of the cart body
  var cartBodyX = baseX;

  // Basket body
  g += rrectStroke(cartBodyX, cartBodyY + cartHeight / 2, cartWidth, cartHeight, 20 * cartScale, strokeCol, CART_STROKE);

  // Handle
  var handleXOffset = cartWidth / 2 - 20 * cartScale;
  var handleYOffset = 10 * cartScale;
  g += line(cartBodyX + handleXOffset, cartBodyY + handleYOffset, cartBodyX + handleXOffset, cartBodyY - cartHandleHeight + handleYOffset, strokeCol, CART_STROKE);
  g += line(cartBodyX + handleXOffset, cartBodyY - cartHandleHeight + handleYOffset, cartBodyX - handleXOffset, cartBodyY - cartHandleHeight + handleYOffset, strokeCol, CART_STROKE);
  g += line(cartBodyX - handleXOffset, cartBodyY - cartHandleHeight + handleYOffset, cartBodyX - handleXOffset, cartBodyY + handleYOffset, strokeCol, CART_STROKE);

  // Wheels
  var wheelXOffset = cartWidth / 2 - 30 * cartScale;
  g += dot(baseX - wheelXOffset, baseY, cartWheelR, strokeCol);
  g += dot(baseX + wheelXOffset, baseY, cartWheelR, strokeCol);

  // Items inside
  if (fillLevel > 0) {
    var itemAreaX = cartBodyX - cartWidth / 2 + 40 * cartScale;
    var itemAreaY = cartBodyY + cartHeight - 40 * cartScale;
    var itemAreaW = cartWidth - 80 * cartScale;
    var itemAreaH = cartHeight - 60 * cartScale;
    var filledHeight = itemAreaH * fillLevel;

    var numItems = Math.floor(fillLevel * 12); // Max 12 items
    for (var i = 0; i < numItems; i++) {
      var itemX = itemAreaX + rnd(i * 3 + 1) * itemAreaW;
      var itemY = itemAreaY - filledHeight + rnd(i * 3 + 2) * filledHeight;
      var itemSize = lerp(18, 40, rnd(i * 3 + 3)) * cartScale;
      var itemType = Math.floor(rnd(i * 3 + 4) * 3); // 0: rect, 1: circle, 2: line

      var itemOp = 0.8 + 0.2 * rnd(i * 3 + 5);
      var itemCol = WHITE;
      if (rnd(i * 3 + 6) > 0.7) itemCol = AMBER;
      else if (rnd(i * 3 + 7) > 0.8) itemCol = CORAL;

      if (itemY > itemAreaY - filledHeight && itemY < itemAreaY + itemSize) { // Only draw if within filled area
        if (itemType === 0) { // Rect
          g += rrect(itemX, itemY, itemSize, itemSize * 0.8, itemSize * 0.2, itemCol, itemOp);
        } else if (itemType === 1) { // Circle
          g += dot(itemX, itemY, itemSize / 2, itemCol, itemOp);
        } else { // Line (e.g., a bag)
          g += line(itemX - itemSize / 2, itemY, itemX + itemSize / 2, itemY + itemSize * 0.6, itemCol, 6, itemOp);
        }
      }
    }
  }

  g += '</g>';
  return g;
}

function doorway(x, y, w, h, col, sw, op) {
  var g = '';
  g += line(x - w / 2, y + h / 2, x - w / 2, y - h / 2, col, sw, op); // Left post
  g += line(x + w / 2, y + h / 2, x + w / 2, y - h / 2, col, sw, op); // Right post
  g += line(x - w / 2, y - h / 2, x + w / 2, y - h / 2, col, sw, op); // Header
  return g;
}

function questionMark(x, y, size, col, sw, op) {
  var d = "M " + x + " " + (y - size * 0.5) +
          " A " + (size * 0.4) + " " + (size * 0.4) + " 0 1 1 " + (x - size * 0.4) + " " + (y + size * 0.1) +
          " L " + (x - size * 0.4) + " " + (y + size * 0.3) +
          " M " + x + " " + (y + size * 0.6) + " L " + x + " " + (y + size * 0.6); // dot at the bottom
  return pathTag(d, col, sw, op);
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var sfX_start = CX - 300, sfX_end = CX - 120;
  var cartX_start = CX + 300, cartX_end = CX + 80;
  var sfX = lerp(sfX_start, sfX_end, easeOut(ramp(u, 0.0, 0.6)));
  var cartX = lerp(cartX_start, cartX_end, easeOut(ramp(u, 0.0, 0.6)));

  var cartScale_start = 0.6;
  var cartScale_end = 0.8;
  var currentCartScale = lerp(cartScale_start, cartScale_end, smooth(u));

  var sfPose = 0; // Idle
  if (u > 0.6 && u <= 0.9) {
    sfPose = 1; // Grabbing
  } else if (u > 0.9) {
    sfPose = 2; // Pushing
  }

  // Doorway
  var doorwayOp = ramp(u, 0.0, 0.2) * (1 - ramp(u, 0.8, 1.0));
  s += doorway(CX, CY, 400, 800, WHITE, 10, doorwayOp);

  s += stickFigure(sfX, SF_HEAD_Y, AMBER, sfPose, 1);
  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, WHITE, 0, 1);

  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var sfX = CX - 120;
  var cartX = CX + 80;

  var cartScale_start = 0.8;
  var cartScale_end = 1.2;
  var currentCartScale = lerp(cartScale_start, cartScale_end, smooth(u));

  // Aisle lines - simple vertical lines, slightly moving
  var lineOp = 0.15;
  var lineSpeed = u * 100;
  for (var i = 0; i < 4; i++) {
    var yOffset = (lineSpeed + i * 400) % (BOT - TOP);
    s += line(CX - 250, TOP + yOffset, CX - 250, TOP + yOffset + 100, DIM, 4, lineOp);
    s += line(CX + 250, TOP + yOffset, CX + 250, TOP + yOffset + 100, DIM, 4, lineOp);
  }

  s += stickFigure(sfX, SF_HEAD_Y, AMBER, 2, 1); // Pushing
  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, WHITE, 0.05, 1); // Small fill

  return s;
}

/* SCENE 3 (20-30): SEARCH */
function scene3(u) {
  var s = '';
  var sfX = CX - 120;
  var cartX = CX + 80;
  var currentCartScale = 1.2; // Stable from previous scene
  var fillLevel = 0.05; // Stable

  // Stick figure looks into cart
  s += stickFigure(sfX, SF_HEAD_Y, AMBER, 3, 1);

  // Question mark thought bubble
  var qmOp = ramp(u, 0.1, 0.4) * (1 - ramp(u, 0.5, 0.7));
  if (qmOp > 0.01) {
    s += questionMark(sfX + 100, SF_HEAD_Y - 100, 80, CORAL, 10, qmOp);
  }

  // Outline of a full cart
  var fullCartOp = ramp(u, 0.6, 0.9);
  if (fullCartOp > 0.01) {
    var bubbleCartX = sfX + 100;
    var bubbleCartY = SF_HEAD_Y - 100 + 120;
    s += rrectStroke(bubbleCartX, bubbleCartY, BASE_CART_WIDTH * 0.8, BASE_CART_HEIGHT * 0.8, 20 * 0.8, CORAL, 8, fullCartOp);
    // Simple fill indicator inside the thought bubble cart
    s += rrect(bubbleCartX, bubbleCartY + BASE_CART_HEIGHT * 0.8 / 4, BASE_CART_WIDTH * 0.6, BASE_CART_HEIGHT * 0.4, 10, CORAL, fullCartOp * 0.6);
  }

  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, WHITE, fillLevel, 1);

  return s;
}

/* SCENE 4 (30-40): FIND */
function scene4(u) {
  var s = '';
  var sfX_start = CX - 120, sfX_end = CX - 180;
  var sfX = lerp(sfX_start, sfX_end, smooth(ramp(u, 0.4, 0.7)));
  var cartX = CX + 80;

  var cartScale_start = 1.2;
  var cartScale_end = 1.3;
  var currentCartScale = lerp(cartScale_start, cartScale_end, smooth(ramp(u, 0.1, 0.4)));
  var fillLevel = 0.05;

  var cartStrokeCol = WHITE;
  var blueGlowOp = ramp(u, 0.0, 0.3);
  if (blueGlowOp > 0.01) {
    cartStrokeCol = BLUE;
    // Blue wave emanating from cart
    var waveRadius = lerp(0, 300, easeOut(u));
    var waveOp = (1 - u) * 0.6;
    s += ring(cartX, CART_WHEELS_Y - (BASE_CART_HEIGHT * currentCartScale) / 2, waveRadius, BLUE, 10, waveOp * blueGlowOp);
  }

  s += stickFigure(sfX, SF_HEAD_Y, AMBER, 2, 1); // Pushing (subtly pushed)
  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, cartStrokeCol, fillLevel, 1);

  return s;
}

/* SCENE 5 (40-50): TAKE */
function scene5(u) {
  var s = '';
  var sfX = CX - 120;
  var cartX = CX + 80;
  var currentCartScale = 1.3; // Stable
  var cartStrokeCol = BLUE; // Stable

  var fillLevel_start = 0.05;
  var fillLevel_end = 1.0;
  var currentFillLevel = lerp(fillLevel_start, fillLevel_end, smooth(ramp(u, 0.1, 0.7)));

  var sfPose = 2; // Pushing
  if (u > 0.05 && u < 0.75) {
    sfPose = 4; // Dropping item
  }

  s += stickFigure(sfX, SF_HEAD_Y, AMBER, sfPose, 1);
  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, cartStrokeCol, currentFillLevel, 1);

  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE */
function scene6(u) {
  var s = '';
  var sfX_start = CX - 120, sfX_end = CX - 400;
  var cartX_start = CX + 80, cartX_end = CX + 400;

  var sfX = lerp(sfX_start, sfX_end, easeIn(ramp(u, 0.0, 0.7)));
  var cartX = lerp(cartX_start, cartX_end, easeIn(ramp(u, 0.0, 0.7)));

  var currentCartScale = 1.3; // Stable
  var fillLevel = 1.0; // Stable

  var cartStrokeCol = lerp(BLUE, WHITE, smooth(ramp(u, 0.6, 0.9)));
  var sfPose = 2; // Pushing
  if (u > 0.7) { // Thoughtful after pushing out
    sfPose = 0; // Idle, but could imply thoughtful
    s += line(sfX, SF_HEAD_Y - 10, sfX + 20, SF_HEAD_Y - 30, WHITE, SF_STROKE * 0.7, ramp(u, 0.8, 1.0)); // thoughtful gaze line
  }

  // Exit doorway
  var doorwayOp = ramp(u, 0.0, 0.2) * (1 - ramp(u, 0.8, 1.0));
  s += doorway(CX, CY, 400, 800, WHITE, 10, doorwayOp);

  s += stickFigure(sfX, SF_HEAD_Y, AMBER, sfPose, 1);
  s += shoppingCart(cartX, CART_WHEELS_Y, currentCartScale, cartStrokeCol, fillLevel, 1);

  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
