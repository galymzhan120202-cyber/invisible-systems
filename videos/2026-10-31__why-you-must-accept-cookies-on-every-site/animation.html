<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why You Must Accept Cookies On Every Site</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey
var BLUE  = "#4C86F0";              // signal blue  -> the system / rules
var AMBER = "#F2A93B";              // warm amber   -> YOU / what you want
var CORAL = "#FF5B5B";              // coral red    -> the naive model / false signal

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* Stick figure helper */
function stickFigure(x, y, col, pose, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  var headR = 30;
  var bodyLen = 100;
  var armLen = 70;
  var legLen = 90;
  var sw = 9;

  // Head
  g += dot(x, y - headR - bodyLen / 2, headR, col);
  // Body
  g += line(x, y - bodyLen / 2, x, y + bodyLen / 2, col, sw);

  // Arms and Legs
  switch (pose) {
    case 'frustrated':
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 - 40, col, sw); // Left arm up
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 - 40, col, sw); // Right arm up
      break;
    case 'point':
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 + 40, col, sw); // Left arm neutral
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 - 10, col, sw); // Right arm pointing
      break;
    case 'tap':
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 + 40, col, sw); // Left arm neutral
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 + 20, col, sw); // Right arm tapping
      break;
    case 'tired':
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 + 40, col, sw); // Left arm neutral
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 + 40, col, sw); // Right arm neutral
      g += line(x - headR * 0.4, y - headR - bodyLen / 2, x + headR * 0.4, y - headR - bodyLen / 2 + 10, col, sw * 0.6); // Drooped head line
      break;
    case 'understand':
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 + 40, col, sw); // Left arm neutral
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 + 20, col, sw); // Right arm tapping
      g += line(x - headR * 0.4, y - headR - bodyLen / 2 + 10, x + headR * 0.4, y - headR - bodyLen / 2 + 10, col, sw * 0.6); // Subtle nod
      break;
    default: // 'desk' or neutral
      g += line(x, y - bodyLen / 2 + 20, x - armLen, y - bodyLen / 2 + 40, col, sw); // Left arm neutral
      g += line(x, y - bodyLen / 2 + 20, x + armLen, y - bodyLen / 2 + 40, col, sw); // Right arm neutral
      break;
  }

  g += line(x, y + bodyLen / 2, x - 30, y + bodyLen / 2 + legLen, col, sw); // Left leg
  g += line(x, y + bodyLen / 2, x + 30, y + bodyLen / 2 + legLen, col, sw); // Right leg

  g += '</g>';
  return g;
}

/* Cookie icon helper */
function cookieIcon(x, y, size, type, col, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  var sw = size / 8;

  if (type === 'simple') {
    g += ring(x, y, size, col, sw);
    g += dot(x + size * 0.4, y - size * 0.3, sw * 0.8, col);
    g += dot(x - size * 0.2, y + size * 0.5, sw * 0.8, col);
    g += dot(x + size * 0.1, y + size * 0.1, sw * 0.8, col);
  } else if (type === 'data') {
    g += ring(x, y, size, col, sw);
    g += dot(x, y, sw * 1.2, col);
    g += line(x, y, x + size * 0.8, y, col, sw * 0.6);
    g += line(x, y, x - size * 0.6, y + size * 0.5, col, sw * 0.6);
    g += line(x, y, x + size * 0.4, y - size * 0.7, col, sw * 0.6);
    g += dot(x + size * 0.8, y, sw * 0.8, col);
    g += dot(x - size * 0.6, y + size * 0.5, sw * 0.8, col);
    g += dot(x + size * 0.4, y - size * 0.7, sw * 0.8, col);
  } else if (type === 'legal') {
    var rectW = size * 2.2, rectH = size * 2.8;
    g += rrect(x, y, rectW, rectH, size * 0.3, col, op * 0.15); // Background fill
    g += rrectStroke(x, y, rectW, rectH, size * 0.3, col, sw);
    g += line(x - rectW * 0.7, y - rectH * 0.4, x + rectW * 0.7, y - rectH * 0.4, col, sw * 0.7);
    g += line(x - rectW * 0.7, y - rectH * 0.1, x + rectW * 0.7, y - rectH * 0.1, col, sw * 0.7);
    g += line(x - rectW * 0.7, y + rectH * 0.2, x + rectW * 0.7, y + rectH * 0.2, col, sw * 0.7);
    g += line(x - rectW * 0.7, y + rectH * 0.5, x + rectW * 0.4, y + rectH * 0.5, col, sw * 0.7);
  }
  g += '</g>';
  return g;
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

var YOU_Y = BOT - 400; // Vertical position for the stick figure's waist
var DESK_Y = YOU_Y + 100;
var SCREEN_W = 700, SCREEN_H = 800;
var SCREEN_X = CX, SCREEN_Y = DESK_Y - SCREEN_H / 2 - 100;

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15); // Desk base

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8); // Screen bezel

  // Screen content (subtle lines)
  var contentFade = ramp(u, 0.1, 0.6);
  if (contentFade > 0.01) {
    s += line(SCREEN_X - 250, SCREEN_Y - 200, SCREEN_X + 200, SCREEN_Y - 200, DIM, 6, contentFade * 0.6);
    s += line(SCREEN_X - 220, SCREEN_Y - 100, SCREEN_X + 250, SCREEN_Y - 100, DIM, 6, contentFade * 0.6);
    s += line(SCREEN_X - 180, SCREEN_Y, SCREEN_X + 180, SCREEN_Y, DIM, 6, contentFade * 0.6);
    s += line(SCREEN_X - 200, SCREEN_Y + 100, SCREEN_X + 220, SCREEN_Y + 100, DIM, 6, contentFade * 0.6);
  }

  // Cookie icon
  var cookieFadeIn = ramp(u, 0.2, 0.4);
  var cookieFadeOut = 1 - ramp(u, 0.7, 0.9);
  var cookieOp = cookieFadeIn * cookieFadeOut;
  if (cookieOp > 0.01) {
    s += cookieIcon(SCREEN_X, SCREEN_Y - 300, 40, 'simple', WHITE, cookieOp);
  }

  // YOU stick figure
  s += stickFigure(CX, YOU_Y, AMBER, 'desk', 1);

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var shake = Math.sin(u * 42) * 3 * pulse(u, 0.18, 0.14);
  s += '<g ' + camera(1.0, shake, 0) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15);

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8);

  // Cookie Banner
  var bannerSlide = easeOut(ramp(u, 0.0, 0.3));
  var bannerY = lerp(SCREEN_Y + SCREEN_H / 2 + 300, SCREEN_Y, bannerSlide); // Slides up from below
  var bannerH = SCREEN_H * 0.8;
  s += rrect(SCREEN_X, bannerY, SCREEN_W, bannerH, 30, BLUE, 0.95);

  // "Accept Cookies?" text implied by layout
  s += rrect(SCREEN_X, bannerY - bannerH * 0.3, SCREEN_W * 0.7, 80, 15, WHITE, 0.15); // Placeholder for text
  s += rrect(SCREEN_X, bannerY - bannerH * 0.1, SCREEN_W * 0.6, 80, 15, WHITE, 0.1);

  // Cookie icon (data cluster) on banner
  var cookieSize = lerp(40, 60, bannerSlide);
  s += cookieIcon(SCREEN_X, bannerY + bannerH * 0.35, cookieSize, 'data', WHITE, 1);

  // YOU stick figure recoils
  var recoilY = lerp(YOU_Y, YOU_Y - 20, smooth(ramp(u, 0.1, 0.4)));
  s += stickFigure(CX, recoilY, AMBER, 'frustrated', 1);

  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH — is something targeting me? (funnel + coral beam on the OTHER lane) */
function scene3(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15);

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8);

  // Cookie Banner
  var bannerH = SCREEN_H * 0.8;
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, bannerH, 30, BLUE, 0.95);

  s += rrect(SCREEN_X, SCREEN_Y - bannerH * 0.3, SCREEN_W * 0.7, 80, 15, WHITE, 0.15);
  s += rrect(SCREEN_X, SCREEN_Y - bannerH * 0.1, SCREEN_W * 0.6, 80, 15, WHITE, 0.1);

  // "Decline" button (coral X)
  var declineX = SCREEN_X - SCREEN_W * 0.3;
  var declineY = SCREEN_Y + bannerH * 0.2;
  var declineFade = 1 - ramp(u, 0.3, 0.6);
  if (declineFade > 0.01) {
    s += line(declineX - 20, declineY - 20, declineX + 20, declineY + 20, CORAL, 10, declineFade);
    s += line(declineX - 20, declineY + 20, declineX + 20, declineY - 20, CORAL, 10, declineFade);
  }

  // Cookie icon (data cluster) flashes coral
  var cookieCol = WHITE;
  var flash = pulse(u, 0.5, 0.1);
  if (flash > 0.1) cookieCol = CORAL;
  s += cookieIcon(SCREEN_X, SCREEN_Y + bannerH * 0.35, 60, 'data', cookieCol, 1);

  // YOU stick figure pointing
  s += stickFigure(CX, YOU_Y, AMBER, 'point', 1);

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND — belts; slow lane passed for minutes, fast lane overtakes in seconds */
function scene4(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15);

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8);

  // Banner transforms into a "Law" block
  var bannerTransform = smooth(ramp(u, 0.0, 0.3));
  var bannerW = lerp(SCREEN_W, SCREEN_W * 0.7, bannerTransform);
  var bannerH = lerp(SCREEN_H * 0.8, SCREEN_H * 0.6, bannerTransform);
  var bannerX = lerp(SCREEN_X, SCREEN_X - 100, bannerTransform);
  var bannerY = lerp(SCREEN_Y, SCREEN_Y - 50, bannerTransform);
  s += rrect(bannerX, bannerY, bannerW, bannerH, 20, BLUE, 0.95);

  // "Accept" button
  var acceptBtnW = 200, acceptBtnH = 80;
  var acceptBtnX = SCREEN_X + SCREEN_W * 0.2;
  var acceptBtnY = SCREEN_Y + SCREEN_H * 0.3;
  s += rrect(acceptBtnX, acceptBtnY, acceptBtnW, acceptBtnH, 15, AMBER, 0.9);

  // Cookie icon (legal document)
  var cookieSize = 60;
  s += cookieIcon(bannerX, bannerY + bannerH * 0.2, cookieSize, 'legal', BLUE, 1);

  // YOU stick figure tapping
  s += stickFigure(CX, YOU_Y, AMBER, 'tap', 1);

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE — losing moments stack into a tall coral memory column */
function scene5(u) {
  var s = '';
  var scale = lerp(1.0, 0.8, smooth(u));
  s += '<g ' + camera(scale, 0, lerp(0, 90, smooth(u))) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15);

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8);

  // "Law" block (from previous scene)
  var bannerW = SCREEN_W * 0.7;
  var bannerH = SCREEN_H * 0.6;
  var bannerX = SCREEN_X - 100;
  var bannerY = SCREEN_Y - 50;
  s += rrect(bannerX, bannerY, bannerW, bannerH, 20, BLUE, 0.95);
  s += cookieIcon(bannerX, bannerY + bannerH * 0.2, 60, 'legal', BLUE, 1);

  // Stack of "Accept" banners
  var stackBaseY = DESK_Y + 300;
  var stackX = CX + 300;
  var nBanners = 6;
  var prog = smooth(ramp(u, 0.05, 0.82)) * nBanners;
  var stacked = Math.floor(prog);
  var bannerTileH = 100;

  for (var i = 0; i < nBanners; i++) {
    var tileY = stackBaseY - i * bannerTileH;
    if (i < stacked) {
      s += rrect(stackX, tileY, 200, bannerTileH - 20, 10, BLUE, 0.8);
      s += cookieIcon(stackX, tileY, 30, 'legal', WHITE, 0.8); // Smaller icon on stacked banners
    } else {
      var fp = clamp(prog - i, 0, 1);
      if (fp > 0) {
        var startY = DESK_Y - 200 - rnd(i) * 100;
        var currentY = lerp(startY, tileY, easeOut(fp));
        s += rrect(stackX, currentY, 200, bannerTileH - 20, 10, BLUE, 0.8 * fp);
        s += cookieIcon(stackX, currentY, 30, 'legal', WHITE, 0.8 * fp);
      }
    }
  }

  // YOU stick figure tired
  s += stickFigure(CX, YOU_Y, AMBER, 'tired', 1);

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE — one shared finish line, then snap back to plain lanes */
function scene6(u) {
  var s = '';
  var scale = lerp(0.8, 0.92, smooth(clamp(u / 0.7, 0, 1)));
  s += '<g ' + camera(scale, 0, lerp(90, 0, smooth(u))) + '>';

  // Desk
  s += rrect(CX, DESK_Y, 800, 120, 20, WHITE, 0.2);
  s += rrect(CX, DESK_Y + 100, 700, 100, 15, WHITE, 0.15);

  // Screen
  s += rrect(SCREEN_X, SCREEN_Y, SCREEN_W, SCREEN_H, 40, WHITE, 1);
  s += rrectStroke(SCREEN_X, SCREEN_Y, SCREEN_W + 20, SCREEN_H + 20, 50, DIM, 8, 0.8);

  // New cookie banner (less intrusive)
  var bannerH = SCREEN_H * 0.4; // Smaller banner
  var bannerY = SCREEN_Y + SCREEN_H * 0.2;
  s += rrect(SCREEN_X, bannerY, SCREEN_W, bannerH, 20, BLUE, 0.7);

  // "Accept" button
  var acceptBtnW = 200, acceptBtnH = 80;
  var acceptBtnX = SCREEN_X;
  var acceptBtnY = bannerY + bannerH * 0.2;
  s += rrect(acceptBtnX, acceptBtnY, acceptBtnW, acceptBtnH, 15, AMBER, 0.9);

  // Legal document cookie icon in background, less intrusive
  var cookieIconOp = lerp(0.1, 0.05, smooth(u));
  s += cookieIcon(SCREEN_X - 250, SCREEN_Y - 300, 50, 'legal', BLUE, cookieIconOp);
  s += cookieIcon(SCREEN_X + 200, SCREEN_Y - 100, 40, 'legal', BLUE, cookieIconOp * 0.8);

  // YOU stick figure with understanding, tapping
  s += stickFigure(CX, YOU_Y, AMBER, 'understand', 1);

  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
