<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Supermarket Aisles Are So Wide</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> the system / the rule
var AMBER = "#F2A93B";              // warm amber   -> YOU / what you want
var CORAL = "#FF5B5B";              // coral red    -> the naive model / false signal

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}

function rgbToHex(r, g, b) {
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function lerpColor(a, b, t) {
  var rgbA = hexToRgb(a);
  var rgbB = hexToRgb(b);
  var r = Math.round(lerp(rgbA[0], rgbB[0], t));
  var g = Math.round(lerp(rgbA[1], rgbB[1], t));
  var b = Math.round(lerp(rgbA[2], rgbB[2], t));
  return rgbToHex(r, g, b);
}

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}

/* Custom elements for the supermarket animation */
var SHOPPER_H = 200;
var CART_W = 100;
var CART_H = 80;
var SHOPPER_Y = BOT - 100; // Feet Y position for main shopper
var CART_Y = SHOPPER_Y - 10; // Bottom Y of cart
var SHOPPER_X_OFFSET = -60; // Shopper x relative to cart x
var MAIN_SHOPPER_X = CX + SHOPPER_X_OFFSET; // Main shopper's X coordinate

// Stick figure: x, y are feet position; h is total height
function stickFigure(x, y, h, col, pose, op) {
  op = (op == null ? 1 : op);
  var headR = h / 8;
  var bodyLen = h / 2.5;
  var armLen = h / 3.5;
  var legLen = h / 2.5;

  var headY = y - legLen - bodyLen - headR;
  var bodyY1 = headY + headR;
  var bodyY2 = bodyY1 + bodyLen;
  var armY = bodyY1 + bodyLen * 0.3;
  var legY = bodyY2;
  var footY = y;

  var g = '<g opacity="' + op + '">';
  g += dot(x, headY, headR, col); // Head
  g += line(x, bodyY1, x, bodyY2, col, 7); // Body

  // Arms
  if (pose === "struggle") {
    g += line(x, armY, x - armLen * 0.7, armY - armLen * 0.4, col, 7);
    g += line(x, armY, x + armLen * 0.7, armY + armLen * 0.4, col, 7);
  } else if (pose === "lookAround") {
    g += line(x, armY, x - armLen * 0.6, armY + armLen * 0.3, col, 7);
    g += line(x, armY, x + armLen * 0.6, armY - armLen * 0.3, col, 7);
  } else if (pose === "browse") {
    g += line(x, armY, x - armLen * 0.4, armY + armLen * 0.2, col, 7);
    g += line(x, armY, x + armLen * 0.4, armY + armLen * 0.2, col, 7);
  } else if (pose === "pickUp") {
    g += line(x, armY, x - armLen * 0.6, armY + armLen * 0.6, col, 7); // Reaching down
    g += line(x, armY, x + armLen * 0.4, armY + armLen * 0.2, col, 7);
  } else if (pose === "aware") {
    g += line(x, armY, x - armLen * 0.5, armY + armLen * 0.1, col, 7);
    g += line(x, armY, x + armLen * 0.5, armY + armLen * 0.1, col, 7);
  } else { // Default / "stand"
    g += line(x, armY, x - armLen * 0.4, armY + armLen * 0.6, col, 7);
    g += line(x, armY, x + armLen * 0.4, armY + armLen * 0.6, col, 7);
  }

  // Legs
  g += line(x, legY, x - legLen * 0.3, footY, col, 7);
  g += line(x, legY, x + legLen * 0.3, footY, col, 7);

  g += '</g>';
  return g;
}

// Shopping cart: x, y are the bottom-center of the cart.
function shoppingCart(x, y, w, h, col, op, fillLevel = 0) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  var bodyX = x;
  var bodyY = y - h / 2; // Center Y of the basket
  // Basket
  g += rrectStroke(bodyX, bodyY, w, h, 8, col, 7);
  // Handle
  g += line(bodyX + w / 2 - 5, bodyY - h / 2 + 5, bodyX + w / 2 + 15, bodyY - h / 2 + 5, col, 7);
  // Wheels
  g += dot(bodyX - w / 2 + 15, y - 5, 8, col);
  g += dot(bodyX + w / 2 - 15, y - 5, 8, col);

  // Fill level for scene 5
  if (fillLevel > 0) {
    var filledHeight = h * fillLevel;
    g += rrect(bodyX, bodyY + h/2 - filledHeight/2, w - 10, filledHeight, 4, AMBER, op * 0.8);
  }
  g += '</g>';
  return g;
}

// Aisle lines
function aisleLines(x1, x2, y1, y2, col, sw, op) {
  return line(x1, y1, x1, y2, col, sw, op) +
         line(x2, y1, x2, y2, col, sw, op);
}

// Thought bubble
function thoughtBubble(x, y, size, col, op) {
  var g = '<g opacity="' + op + '">';
  // Main bubble shape (simple rounded rect for now)
  g += rrect(x, y, size * 1.6, size * 1.2, size * 0.3, col, 0.2); // Faint background
  g += rrectStroke(x, y, size * 1.6, size * 1.2, size * 0.3, col, 5);
  // Little "tail" bubbles
  g += dot(x - size * 0.6, y + size * 0.8, size * 0.2, col, 0.2);
  g += dot(x - size * 0.8, y + size * 1.0, size * 0.1, col, 0.2);
  // Content: simple cart icon (two parallel lines)
  g += line(x - size * 0.3, y, x - size * 0.1, y, WHITE, 5);
  g += line(x + size * 0.1, y, x + size * 0.3, y, WHITE, 5);
  g += '</g>';
  return g;
}

// Thought bubble fragments for crumbling effect
function thoughtBubbleFragments(x, y, size, col, u_crumble, op) {
  var g = '<g opacity="' + op + '">';
  var numFragments = 10;
  for (var i = 0; i < numFragments; i++) {
    var fragX = x + Math.sin(i * 1.2 + u_crumble * 10) * size * 0.5 * u_crumble + rnd(i) * 20 - 10;
    var fragY = y - size * 0.5 + Math.cos(i * 0.8 + u_crumble * 10) * size * 0.5 * u_crumble + rnd(i + 5) * 20 - 10;
    var fragSize = lerp(size * 0.2, 0, u_crumble);
    g += rrect(fragX, fragY, fragSize, fragSize, fragSize * 0.2, WHITE, 1 - u_crumble);
  }
  g += '</g>';
  return g;
}

// Item icon (simple square)
function itemIcon(x, y, size, col, op) {
  return rrect(x, y, size, size, size * 0.2, col, op);
}

// Insight icon (lightbulb shape)
function insightIcon(x, y, size, col, op) {
  var g = '<g opacity="' + op + '">';
  // Bulb top
  var d = "M " + (x - size * 0.4) + " " + (y - size * 0.4) +
          " A " + (size * 0.4) + " " + (size * 0.4) + " 0 1 1 " + (x + size * 0.4) + " " + (y - size * 0.4) +
          " L " + (x + size * 0.3) + " " + (y + size * 0.1) +
          " Q " + x + " " + (y + size * 0.5) + " " + (x - size * 0.3) + " " + (y + size * 0.1) +
          " Z";
  g += pathTag(d, col, 7, op);
  g += '<circle cx="' + x + '" cy="' + (y - size * 0.2) + '" r="' + (size * 0.2) + '" fill="' + col + '" opacity="' + op * 0.3 + '"/>'; // Inner glow
  g += '</g>';
  return g;
}

function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var narrowAisleW = 120;
  var aisleX1 = CX - narrowAisleW / 2;
  var aisleX2 = CX + narrowAisleW / 2;

  var camShake = Math.sin(u * 20) * 3 * pulse(u, 0.5, 0.4); // Subtle shake
  s += '<g ' + camera(1.0, camShake, 0) + '>';

  // Aisle lines
  s += aisleLines(aisleX1, aisleX2, TOP, BOT, CORAL, 10, 0.9);

  // Other shoppers
  var numOtherShoppers = 8;
  var otherShopperGap = 220;
  var otherShopperH = 100;
  for (var i = 0; i < numOtherShoppers; i++) {
    var yOffset = (u * 120 + rnd(i) * 80) % (BOT - TOP + otherShopperH);
    var otherY = BOT - yOffset;
    var otherX = aisleX1 + (rnd(i + 10) > 0.5 ? 30 : narrowAisleW - 30);
    // Add some random horizontal movement
    otherX += Math.sin(u * 15 + i) * 10;
    // Ensure they stay within the aisle
    otherX = clamp(otherX, aisleX1 + 20, aisleX2 - 20);

    if (otherY > TOP - otherShopperH && otherY < BOT + otherShopperH) {
      s += stickFigure(otherX, otherY, otherShopperH, WHITE, "struggle", 0.7);
    }
  }

  // Amber shopper and cart
  var shopperBob = Math.sin(u * Math.PI * 4) * 3; // Subtle bobbing
  s += shoppingCart(MAIN_SHOPPER_X + 80, CART_Y + shopperBob, CART_W, CART_H, AMBER, 1);
  s += stickFigure(MAIN_SHOPPER_X, SHOPPER_Y + shopperBob, SHOPPER_H, AMBER, "struggle", 1);

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var narrowAisleW = 120;
  var wideAisleW = 400;

  var aisleX1_start = CX - narrowAisleW / 2;
  var aisleX2_start = CX + narrowAisleW / 2;
  var aisleX1_end = CX - wideAisleW / 2;
  var aisleX2_end = CX + wideAisleW / 2;

  var expand = smooth(ramp(u, 0.1, 0.7)); // Aisle expansion
  var aisleX1 = lerp(aisleX1_start, aisleX1_end, expand);
  var aisleX2 = lerp(aisleX2_start, aisleX2_end, expand);
  var aisleCol = lerpColor(CORAL, WHITE, expand);
  var aisleSW = lerp(10, 8, expand);

  var camScale = lerp(1.0, 0.9, smooth(ramp(u, 0.2, 0.8)));
  var camTY = lerp(0, -50, smooth(ramp(u, 0.2, 0.8)));
  s += '<g ' + camera(camScale, 0, camTY) + '>';

  s += aisleLines(aisleX1, aisleX2, TOP, BOT, aisleCol, aisleSW, 0.9);

  // Amber shopper and cart
  var shopperBob = Math.sin(u * Math.PI * 2) * 2; // Subtle bobbing
  s += shoppingCart(MAIN_SHOPPER_X + 80, CART_Y + shopperBob, CART_W, CART_H, AMBER, 1);
  s += stickFigure(MAIN_SHOPPER_X, SHOPPER_Y + shopperBob, SHOPPER_H, AMBER, "lookAround", 1);

  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH — naive guess about the reason */
function scene3(u) {
  var s = '';
  var wideAisleW = 400;
  var aisleX1 = CX - wideAisleW / 2;
  var aisleX2 = CX + wideAisleW / 2;

  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += aisleLines(aisleX1, aisleX2, TOP, BOT, WHITE, 8, 0.9);

  // Amber shopper and cart
  s += shoppingCart(MAIN_SHOPPER_X + 80, CART_Y, CART_W, CART_H, AMBER, 1);
  s += stickFigure(MAIN_SHOPPER_X, SHOPPER_Y, SHOPPER_H, AMBER, "stand", 1);

  // Thought bubble appears
  var thoughtOp = ramp(u, 0.0, 0.2) * (1 - ramp(u, 0.4, 0.5));
  if (thoughtOp > 0.01) {
    s += thoughtBubble(MAIN_SHOPPER_X, SHOPPER_Y - SHOPPER_H - 40, 60, CORAL, thoughtOp);
  }

  // Thought bubble crumbles
  var crumbleU = ramp(u, 0.5, 0.8);
  if (crumbleU > 0.01) {
    s += thoughtBubbleFragments(MAIN_SHOPPER_X, SHOPPER_Y - SHOPPER_H - 40, 60, CORAL, crumbleU, 1);
  }

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND — the true mechanism is revealed */
function flowDots(x, yStart, yEnd, phase, col, op) {
  var g = '';
  var dotGap = 100;
  var dotR = 8;
  var offset = (phase % 1) * dotGap;
  for (var y = yStart - dotGap + offset; y < yEnd + dotGap; y += dotGap) {
    g += dot(x, y, dotR, col, op);
  }
  return g;
}

function scene4(u) {
  var s = '';
  var wideAisleW = 400;
  var aisleX1 = CX - wideAisleW / 2;
  var aisleX2 = CX + wideAisleW / 2;

  // Aisle lines transform to blue
  var transformU = smooth(ramp(u, 0.0, 0.3));
  var aisleCol = lerpColor(WHITE, BLUE, transformU);
  var aisleSW = lerp(8, 12, transformU); // Thicker for emphasis

  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += aisleLines(aisleX1, aisleX2, TOP, BOT, aisleCol, aisleSW, 0.9);

  // Faint blue dotted lines for flow
  var flowOp = ramp(u, 0.2, 0.5);
  s += flowDots(aisleX1 + wideAisleW * 0.25, TOP, BOT, u * 0.5, BLUE, 0.2 * flowOp);
  s += flowDots(aisleX2 - wideAisleW * 0.25, TOP, BOT, u * 0.5 + 0.5, BLUE, 0.2 * flowOp);

  // Amber shopper and cart
  var shopperMoveX = lerp(MAIN_SHOPPER_X, CX, smooth(ramp(u, 0.4, 0.8))); // Move to center of aisle
  var shopperBob = Math.sin(u * Math.PI * 2) * 2;
  s += shoppingCart(shopperMoveX + 80, CART_Y + shopperBob, CART_W, CART_H, AMBER, 1);
  s += stickFigure(shopperMoveX, SHOPPER_Y + shopperBob, SHOPPER_H, AMBER, "browse", 1);

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE — the cost: increased spending */
function scene5(u) {
  var s = '';
  var wideAisleW = 400;
  var aisleX1 = CX - wideAisleW / 2;
  var aisleX2 = CX + wideAisleW / 2;

  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += aisleLines(aisleX1, aisleX2, TOP, BOT, BLUE, 12, 0.9);

  // Shelves (simple rectangles)
  var shelfH = BOT - TOP;
  var shelfW = 100;
  s += rrect(aisleX1 - shelfW / 2 - 20, CY, shelfW, shelfH, 10, DIM, 0.2);
  s += rrect(aisleX2 + shelfW / 2 + 20, CY, shelfW, shelfH, 10, DIM, 0.2);

  // Amber shopper and cart
  var shopperBob = Math.sin(u * Math.PI * 3) * 3;
  var shopperX = CX; // Shopper is centered in the aisle
  s += shoppingCart(shopperX + 80, CART_Y + shopperBob, CART_W, CART_H, AMBER, 1, ramp(u, 0.6, 0.9)); // Cart fills up
  s += stickFigure(shopperX, SHOPPER_Y + shopperBob, SHOPPER_H, AMBER, "pickUp", 1);

  // Items appearing and dropping
  var numItems = 5;
  var itemSize = 30;
  var itemDropTime = 0.8 / numItems; // Time for each item to drop
  var cartTargetX = shopperX + 80;
  var cartTargetY = CART_Y + CART_H * 0.3; // Approx center of cart body

  for (var i = 0; i < numItems; i++) {
    var itemStartTime = i * itemDropTime;
    var itemEndTime = itemStartTime + itemDropTime * 0.6;
    var dropU = ramp(u, itemStartTime, itemEndTime);

    if (dropU > 0) {
      var shelfX = (i % 2 === 0) ? aisleX1 - 70 : aisleX2 + 70; // Alternate shelves
      var shelfY = TOP + 100 + (i * 150 + rnd(i) * 50) % (BOT - TOP - 200);
      var currentItemX = lerp(shelfX, cartTargetX, easeOut(dropU));
      var currentItemY = lerp(shelfY, cartTargetY, easeIn(dropU));
      s += itemIcon(currentItemX, currentItemY, itemSize, AMBER, 1 - dropU * 0.5); // Fade slightly
    }
  }

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE — shopper is now aware */
function scene6(u) {
  var s = '';
  var wideAisleW = 400;
  var aisleX1 = CX - wideAisleW / 2;
  var aisleX2 = CX + wideAisleW / 2;

  var camScale = lerp(1.0, 0.85, smooth(ramp(u, 0.2, 0.8)));
  var camTY = lerp(0, -70, smooth(ramp(u, 0.2, 0.8)));
  s += '<g ' + camera(camScale, 0, camTY) + '>';

  s += aisleLines(aisleX1, aisleX2, TOP, BOT, BLUE, 12, 0.9);

  // Amber shopper and cart (full)
  var shopperBob = Math.sin(u * Math.PI * 2) * 2;
  var shopperX = CX; // Shopper is centered in the aisle
  s += shoppingCart(shopperX + 80, CART_Y + shopperBob, CART_W, CART_H, AMBER, 1, 1); // Cart full
  s += stickFigure(shopperX, SHOPPER_Y + shopperBob, SHOPPER_H, AMBER, "aware", 1);

  // Insight icon appears
  var insightOp = ramp(u, 0.0, 0.2);
  if (insightOp > 0.01) {
    s += insightIcon(shopperX, SHOPPER_Y - SHOPPER_H - 40, 40, AMBER, insightOp);
  }

  // Subtle glow around shopper to emphasize awareness
  var glowOp = Math.sin(u * Math.PI * 4) * 0.1 + 0.1;
  s += ring(shopperX, SHOPPER_Y - SHOPPER_H / 2, SHOPPER_H * 0.6, AMBER, 5, glowOp * ramp(u, 0.3, 0.8));

  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
