<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Software Updates Are So Large</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> the system / the wave
var AMBER = "#F2A93B";              // warm amber   -> YOU / what you want
var CORAL = "#FF5B5B";              // coral red    -> the naive model / false signal

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* stick figure: head, body, arms, legs */
function stickFigure(x, y, col, pose, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '" stroke="' + col + '" stroke-width="10" stroke-linecap="round">';
  // Head
  g += dot(x, y - 100, 36, col); // Head radius 36 -> diameter 72. Y-100 is top of body.
  // Body
  g += line(x, y - 60, x, y + 40, col); // Body length 100
  // Arms
  if (pose === 'hands_on_hips') {
    g += line(x, y - 40, x - 60, y);
    g += line(x, y - 40, x + 60, y);
    g += line(x - 60, y, x - 60, y + 30);
    g += line(x + 60, y, x + 60, y + 30);
  } else if (pose === 'pointing') {
    g += line(x, y - 40, x - 60, y + 20); // Left arm down
    g += line(x, y - 40, x + 80, y - 60); // Right arm pointing up-right
    g += dot(x + 80, y - 60, 12, col); // Hand
  } else if (pose === 'confused') {
    g += line(x, y - 40, x - 60, y + 10);
    g += line(x, y - 40, x + 60, y + 10);
    g += line(x - 60, y + 10, x - 40, y + 40); // Shrug
    g += line(x + 60, y + 10, x + 40, y + 40); // Shrug
  } else if (pose === 'overwhelmed') { // Hands on head
    g += line(x, y - 40, x - 70, y - 10);
    g += line(x, y - 40, x + 70, y - 10);
    g += line(x - 70, y - 10, x - 50, y - 80);
    g += line(x + 70, y - 10, x + 50, y - 80);
  } else if (pose === 'waiting') { // Hands clasped
    g += line(x, y - 40, x - 60, y + 30);
    g += line(x, y - 40, x + 60, y + 30);
    g += line(x - 60, y + 30, x, y + 50); // Left arm to center
    g += line(x + 60, y + 30, x, y + 50); // Right arm to center
  } else if (pose === 'annoyed') { // Fists on hips
    g += line(x, y - 40, x - 60, y + 10);
    g += line(x, y - 40, x + 60, y + 10);
    g += dot(x - 60, y + 10, 12, col);
    g += dot(x + 60, y + 10, 12, col);
  } else { // default: relaxed
    g += line(x, y - 40, x - 60, y + 20);
    g += line(x, y - 40, x + 60, y + 20);
  }
  // Legs
  g += line(x, y + 40, x - 40, y + 120);
  g += line(x, y + 40, x + 40, y + 120);
  g += '</g>';
  return g;
}

/* software module: a rounded rectangle, possibly with internal elements */
function softwareModule(x, y, w, h, rad, col, sw, op, internal) {
  op = (op == null ? 1 : op);
  sw = sw == null ? 10 : sw;
  var g = '<g opacity="' + op + '">';
  g += rrectStroke(x, y, w, h, rad, col, sw, op);
  if (internal) {
    // Example: internal dots for complexity
    for (var i = 0; i < internal; i++) {
      var ix = x + (rnd(i) - 0.5) * (w - 60);
      var iy = y + (rnd(i + 100) - 0.5) * (h - 60);
      g += dot(ix, iy, 12, DIM, 0.6);
    }
  }
  g += '</g>';
  return g;
}

// Global module dimensions for consistency
var MODULE_W_BASE = 480;
var MODULE_H_BASE = 640;
var MODULE_RAD_BASE = 40;

// Helper for system background grid/lines
function systemGrid(op) {
  op = (op == null ? 0.1 : op);
  var s = '';
  var gridStepX = W / 6;
  var gridStepY = (BOT - TOP) / 8;
  for (var i = 1; i < 6; i++) {
    s += line(gridStepX * i, TOP, gridStepX * i, BOT, BLUE, 2, op);
  }
  for (var i = 0; i <= 8; i++) {
    s += line(0, TOP + gridStepY * i, W, TOP + gridStepY * i, BLUE, 2, op);
  }
  return s;
}

// Helper for "diff" icon (plus/minus)
function diffIcon(x, y, size, col, sw, op) {
  var s = '';
  // Minus sign
  s += line(x - size, y - size / 2, x + size, y - size / 2, col, sw, op);
  // Plus sign
  s += line(x - size, y + size / 2, x + size, y + size / 2, col, sw, op);
  s += line(x, y + size / 2 - size, x, y + size / 2 + size, col, sw, op);
  return s;
}

// Helper for "arrow" icon (for download pipe)
function arrow(x, y, size, col, sw, op, direction) { // direction: 'up', 'down', 'left', 'right'
  var s = '';
  var headSize = size / 2;
  if (direction === 'up') {
    s += line(x, y + size, x, y - size, col, sw, op);
    s += line(x, y - size, x - headSize, y - size + headSize, col, sw, op);
    s += line(x, y - size, x + headSize, y - size + headSize, col, sw, op);
  } else if (direction === 'down') {
    s += line(x, y - size, x, y + size, col, sw, op);
    s += line(x, y + size, x - headSize, y + size - headSize, col, sw, op);
    s += line(x, y + size, x + headSize, y + size - headSize, col, sw, op);
  }
  return s;
}


/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): Initial Module */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';
  s += systemGrid(0.1 + pulse(u, 0.5, 0.4) * 0.05);

  var modulePulse = Math.sin(u * Math.PI * 2) * 8;
  s += softwareModule(CX, CY - 100, MODULE_W_BASE + modulePulse, MODULE_H_BASE + modulePulse, MODULE_RAD_BASE, WHITE, 10, 1);

  var figureY = lerp(BOT + 100, BOT - 300, easeOut(ramp(u, 0.1, 0.6)));
  s += stickFigure(CX, figureY, AMBER, 'relaxed', 1);
  var thoughtBubbleOp = ramp(u, 0.6, 0.9);
  if (thoughtBubbleOp > 0.01) {
    s += ring(CX + 100, figureY - 200, 40, AMBER, 7, thoughtBubbleOp);
    s += dot(CX + 100, figureY - 200, 15, AMBER, thoughtBubbleOp);
  }

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): Small changes */
function scene2(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += systemGrid(0.12);

  var moduleGap = lerp(0, 20, smooth(ramp(u, 0.1, 0.4)));
  var moduleScale = lerp(1, 0.8, smooth(ramp(u, 0.0, 0.3)));
  var moduleW = MODULE_W_BASE * moduleScale;
  var moduleH = MODULE_H_BASE * 0.3 * moduleScale;
  var moduleYOffset = moduleH + moduleGap;

  s += softwareModule(CX, CY - moduleYOffset, moduleW, moduleH, MODULE_RAD_BASE, WHITE, 10, 1);
  s += softwareModule(CX, CY, moduleW, moduleH, MODULE_RAD_BASE, WHITE, 10, 1);
  s += softwareModule(CX, CY + moduleYOffset, moduleW, moduleH, MODULE_RAD_BASE, WHITE, 10, 1);

  // Change in the middle module
  var changeOp = smooth(ramp(u, 0.4, 0.7));
  var changeSize = lerp(0, 20, easeOut(ramp(u, 0.4, 0.6)));
  if (changeOp > 0.01) {
    s += dot(CX + 80, CY - 20, changeSize, CORAL, changeOp);
    s += line(CX - 80, CY + 20, CX + 80, CY - 20, CORAL, 8, changeOp * 0.6); // Faint line
  }

  var figureX = lerp(CX, CX + 300, smooth(ramp(u, 0.0, 0.3)));
  s += stickFigure(figureX, BOT - 300, AMBER, 'pointing', 1);
  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): Version Control */
function scene3(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += systemGrid(0.08);

  var stackCount = 4;
  var stackHeight = MODULE_H_BASE * 0.25;
  var stackY = CY - (stackCount - 1) * stackHeight / 2;
  var stackW = MODULE_W_BASE * 0.7;

  // Morph from 3 modules to a stack of 4
  var morph = smooth(ramp(u, 0.0, 0.4));
  var moduleYOffset = MODULE_H_BASE * 0.3 + 20; // from scene 2
  var currentModuleY = lerp(CY, stackY + (stackCount - 1) * stackHeight, morph);
  var currentModuleOp = lerp(1, 1, morph);

  for (var i = 0; i < stackCount; i++) {
    var y = lerp(CY - moduleYOffset * (1 - i), stackY + i * stackHeight, morph);
    var opacity = lerp(1, 0.4 + (i / stackCount) * 0.6, morph);
    s += softwareModule(CX, y, stackW, stackHeight, MODULE_RAD_BASE * 0.8, WHITE, 8, opacity);
  }

  // Diff icon next to the latest version
  var diffOp = smooth(ramp(u, 0.5, 0.8));
  var diffSize = lerp(0, 40, easeOut(ramp(u, 0.5, 0.7)));
  if (diffOp > 0.01) {
    s += diffIcon(CX + stackW / 2 + 80, stackY + (stackCount - 1) * stackHeight, diffSize, CORAL, 10, diffOp);
  }

  var figureX = lerp(CX + 300, CX - 300, smooth(ramp(u, 0.0, 0.3)));
  s += stickFigure(figureX, BOT - 300, AMBER, 'confused', 1);
  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): Dependencies & Bundling */
function scene4(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += systemGrid(0.06);

  var bundleScale = lerp(0.7, 1.1, smooth(ramp(u, 0.0, 0.4)));
  var bundleW = MODULE_W_BASE * bundleScale;
  var bundleH = MODULE_H_BASE * bundleScale;
  s += softwareModule(CX, CY, bundleW, bundleH, MODULE_RAD_BASE * 1.5, BLUE, 12, 0.8, 5);

  var numSmallModules = 6;
  var moduleOrbitRadius = lerp(0, 300, easeOut(ramp(u, 0.2, 0.6)));
  var moduleSize = lerp(0, 120, easeOut(ramp(u, 0.2, 0.6)));

  for (var i = 0; i < numSmallModules; i++) {
    var angle = (u * Math.PI * 2 * 0.1 + i * (Math.PI * 2 / numSmallModules)) % (Math.PI * 2);
    var smallX = CX + Math.cos(angle) * moduleOrbitRadius;
    var smallY = CY + Math.sin(angle) * moduleOrbitRadius;
    s += softwareModule(smallX, smallY, moduleSize, moduleSize * 1.3, 20, WHITE, 8, 1);
    // Connecting lines
    if (moduleOrbitRadius > 50) {
      s += line(smallX, smallY, CX, CY, WHITE, 4, 0.6);
    }
  }

  s += stickFigure(CX, BOT - 300, AMBER, 'overwhelmed', 1);
  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): Full Download */
function scene5(u) {
  var s = '';
  var scale = lerp(1.0, 0.9, smooth(u));
  s += '<g ' + camera(scale, 0, lerp(0, 60, smooth(u))) + '>';
  s += systemGrid(0.04 * (1 - smooth(u)));

  var packageW = lerp(MODULE_W_BASE * 1.1, W - 160, smooth(ramp(u, 0.0, 0.3)));
  var packageH = lerp(MODULE_H_BASE * 1.1, BOT - TOP - 100, smooth(ramp(u, 0.0, 0.3)));
  var packageRad = lerp(MODULE_RAD_BASE * 1.5, 60, smooth(ramp(u, 0.0, 0.3)));

  s += rrectStroke(CX, CY, packageW, packageH, packageRad, WHITE, 12, 1);

  var fill = smooth(ramp(u, 0.4, 0.9));
  var filledH = packageH * fill;
  var filledY = CY + (packageH / 2) - (filledH / 2); // Bottom-up fill
  if (fill > 0.01) {
    s += rrect(CX, filledY, packageW - 20, filledH, packageRad * 0.8, AMBER, 1);
  }

  // Download pipe lines
  var pipeOp = smooth(ramp(u, 0.1, 0.6)) * (1 - smooth(ramp(u, 0.8, 1.0)));
  if (pipeOp > 0.01) {
    s += line(CX - 200, TOP, CX - 100, CY - packageH / 2, BLUE, 8, pipeOp);
    s += line(CX + 200, TOP, CX + 100, CY - packageH / 2, BLUE, 8, pipeOp);
    s += arrow(CX, TOP + 100, 40, BLUE, 8, pipeOp, 'down');
  }

  s += stickFigure(CX, BOT - 300, AMBER, 'waiting', 1);
  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): The Cycle Continues */
function scene6(u) {
  var s = '';
  var scale = lerp(0.9, 1.0, smooth(clamp(u / 0.7, 0, 1)));
  s += '<g ' + camera(scale, 0, lerp(60, 0, smooth(u))) + '>';
  s += systemGrid(0.08);

  // Delivered module moves off screen
  var deliveredY = lerp(CY, BOT + 400, easeIn(ramp(u, 0.0, 0.4)));
  var deliveredOp = lerp(1, 0, ramp(u, 0.3, 0.5));
  s += rrectStroke(CX, deliveredY, W - 160, BOT - TOP - 100, 60, WHITE, 12, deliveredOp);

  // New module appears
  var newModuleY = lerp(TOP - 100, TOP + 300, easeOut(ramp(u, 0.4, 0.7)));
  var newModuleOp = ramp(u, 0.4, 0.7);
  var newModuleW = MODULE_W_BASE * 0.6;
  var newModuleH = MODULE_H_BASE * 0.3;
  s += softwareModule(CX, newModuleY, newModuleW, newModuleH, MODULE_RAD_BASE, WHITE, 10, newModuleOp);

  // Small coral change in the new module
  var changeOp = smooth(ramp(u, 0.7, 0.9));
  var changeSize = lerp(0, 18, easeOut(ramp(u, 0.7, 0.9)));
  if (changeOp > 0.01) {
    s += dot(CX + 60, newModuleY - 10, changeSize, CORAL, changeOp);
    s += line(CX - 60, newModuleY + 10, CX + 60, newModuleY - 10, CORAL, 6, changeOp * 0.6);
  }

  s += stickFigure(CX, BOT - 300, AMBER, 'annoyed', 1);
  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
