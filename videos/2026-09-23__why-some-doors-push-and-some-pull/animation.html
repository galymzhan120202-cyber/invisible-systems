<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Doors Open Differently</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band
var DUR = 60;
window.__duration = DUR;

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey
var BLUE  = "#4C86F0";              // signal blue  -> the system / clarity
var AMBER = "#F2A93B";              // warm amber   -> YOU / understanding
var CORAL = "#FF5B5B";              // coral red    -> confusion / frustration

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

// Helper for color interpolation
function lerpColor(a, b, t) {
  var hexToRgb = function(hex) {
    var r = parseInt(hex.substring(1, 3), 16);
    var g = parseInt(hex.substring(3, 5), 16);
    var b = parseInt(hex.substring(5, 7), 16);
    return [r, g, b];
  };
  var rgbToHex = function(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  };

  var c1 = hexToRgb(a);
  var c2 = hexToRgb(b);

  var r = Math.round(lerp(c1[0], c2[0], t));
  var g = Math.round(lerp(c1[1], c2[1], t));
  var b = Math.round(lerp(c1[2], c2[2], t));

  return rgbToHex(r, g, b);
}

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}

/* ---------- custom elements ---------- */
var DOOR_W = 200, DOOR_H = 800;
var DOOR_X = CX, DOOR_Y = CY - 40;
var FIGURE_H_APPROX = 180;
var FIGURE_Y_BASE = BOT - 200; // Base Y for stick figures
var DOOR_FRAME_SW = 10;

function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

function drawStickFigure(g, x, y, scale, col, pose, opacity, phase) {
  opacity = (opacity == null ? 1 : opacity);
  phase = (phase == null ? 0 : phase);

  var sw = 8 * scale;
  var headR = 20 * scale;
  var bodyLen = 80 * scale;
  var armLen = 50 * scale;
  var legLen = 60 * scale;

  var headY = y - bodyLen / 2 - headR - 10 * scale;
  var bodyTop = y - bodyLen / 2;
  var bodyBot = y + bodyLen / 2;

  var armAngle = 0, legAngle = 0;
  var bodyLeanX = 0;

  switch (pose) {
    case 'walk':
      armAngle = Math.sin(phase * Math.PI * 2) * 0.4;
      legAngle = Math.sin(phase * Math.PI * 2 + Math.PI) * 0.4;
      bodyLeanX = Math.sin(phase * Math.PI * 2) * 8 * scale;
      break;
    case 'gesture':
      armAngle = -0.8; // right arm up
      break;
    case 'struggle_push':
      bodyLeanX = 20 * scale;
      armAngle = -0.6;
      legAngle = 0.2;
      break;
    case 'struggle_pull':
      bodyLeanX = -20 * scale;
      armAngle = 0.6;
      legAngle = -0.2;
      break;
    case 'confused':
      armAngle = Math.PI / 4; // both arms up, bent
      break;
    case 'observe':
      // Subtle pose, no major limb movement
      break;
    case 'push':
      bodyLeanX = 15 * scale;
      armAngle = -0.4;
      break;
    case 'through':
      bodyLeanX = 5 * scale;
      armAngle = -0.2;
      legAngle = 0.2;
      break;
    default: // 'stand'
      break;
  }

  g += dot(x + bodyLeanX, headY, headR, col, opacity);
  g += line(x + bodyLeanX, bodyTop, x + bodyLeanX, bodyBot, col, sw, opacity);

  var armX1 = x + bodyLeanX;
  var armY1 = bodyTop + 10 * scale;

  if (pose === 'confused') {
    g += pathTag("M " + armX1 + " " + armY1 + " Q " + (armX1 + 20*scale) + " " + (armY1 - 30*scale) + " " + (armX1 + 40*scale) + " " + (armY1 - 10*scale), col, sw, opacity);
    g += pathTag("M " + armX1 + " " + armY1 + " Q " + (armX1 - 20*scale) + " " + (armY1 - 30*scale) + " " + (armX1 - 40*scale) + " " + (armY1 - 10*scale), col, sw, opacity);
  } else if (pose === 'gesture') {
    g += line(armX1, armY1, armX1 + armLen * Math.sin(armAngle), armY1 + armLen * Math.cos(armAngle), col, sw, opacity); // Right arm
    g += line(armX1, armY1, armX1 - 30*scale, armY1 + 20*scale, col, sw, opacity); // Left arm (resting)
  } else {
    g += line(armX1, armY1, armX1 + armLen * Math.sin(armAngle), armY1 + armLen * Math.cos(armAngle), col, sw, opacity);
    g += line(armX1, armY1, armX1 - armLen * Math.sin(armAngle), armY1 + armLen * Math.cos(armAngle), col, sw, opacity);
  }

  var legX1 = x + bodyLeanX;
  var legY1 = bodyBot;
  g += line(legX1, legY1, legX1 + legLen * Math.sin(legAngle), legY1 + legLen * Math.cos(legAngle), col, sw, opacity);
  g += line(legX1, legY1, legX1 - legLen * Math.sin(legAngle), legY1 + legLen * Math.cos(legAngle), col, sw, opacity);

  return g;
}

function doorFrame(x, y, w, h, col, sw, op) {
  return rrectStroke(x, y, w, h, 10, col, sw, op);
}

function pushPlate(x, y, w, h, col, op) {
  return rrect(x, y, w, h, 8, col, op);
}

function pullHandle(x, y, w, h, col, sw, op) {
  var barH = h * 0.8;
  var barW = w * 0.6;
  var radius = w * 0.2;
  var d = "M " + (x - barW/2) + " " + (y - barH/2 + radius) +
          " A " + radius + " " + radius + " 0 0 1 " + (x - barW/2 + radius) + " " + (y - barH/2) +
          " H " + (x + barW/2 - radius) +
          " A " + radius + " " + radius + " 0 0 1 " + (x + barW/2) + " " + (y - barH/2 + radius) +
          " V " + (y + barH/2 - radius) +
          " A " + radius + " " + radius + " 0 0 1 " + (x + barW/2 - radius) + " " + (y + barH/2) +
          " H " + (x - barW/2 + radius) +
          " A " + radius + " " + radius + " 0 0 1 " + (x - barW/2) + " " + (y + barH/2 - radius) +
          " Z";
  return pathTag(d, col, sw, op);
}

function emergencyBar(x, y, w, h, col, op) {
  return rrect(x, y, w, h, 8, col, op);
}

function questionMark(x, y, size, col, op) {
  var sw = size / 8;
  var headR = size / 4;
  var bodyH = size / 2;
  var dotR = size / 10;

  var d = "M " + (x + headR/2) + " " + (y - headR - bodyH/2 - dotR - sw/2) +
          " A " + headR + " " + headR + " 0 1 0 " + (x - headR/2) + " " + (y - headR/2 - bodyH/2 - dotR - sw/2) +
          " V " + (y + bodyH/2 - dotR - sw/2);
  var s = pathTag(d, col, sw, op);
  s += dot(x, y + bodyH/2 + dotR - sw/2, dotR, col, op);
  return s;
}

function crossMark(x, y, size, col, op) {
  var sw = size / 6;
  var d = "M " + (x - size/2) + " " + (y - size/2) + " L " + (x + size/2) + " " + (y + size/2) +
          " M " + (x + size/2) + " " + (y - size/2) + " L " + (x - size/2) + " " + (y + size/2);
  return pathTag(d, col, sw, op);
}

function doorOpeningFrame(x, y, w, h, openAmount, col, sw, op) {
  var leftX = x - w/2;
  var rightX = x + w/2;
  var topY = y - h/2;
  var botY = y + h/2;

  var openWidth = w * openAmount * 0.8;
  var rightPostX = rightX + openWidth;

  var g = '';
  g += line(leftX, topY, leftX, botY, col, sw, op); // Left post
  g += line(rightPostX, topY, rightPostX, botY, col, sw, op); // Right post (moves)
  g += line(leftX, topY, rightPostX, topY, col, sw, op); // Top beam
  g += line(leftX, botY, rightPostX, botY, col, sw, op); // Bottom beam

  return g;
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var figureStartX = CX - 300;
  var figureEndX = DOOR_X - 100;
  var figureX = lerp(figureStartX, figureEndX, easeOut(ramp(u, 0.0, 0.4)));

  var figurePose = 'walk';
  if (u > 0.4) figurePose = 'stand';
  if (u > 0.7) figurePose = 'gesture';

  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += doorFrame(DOOR_X, DOOR_Y, DOOR_W, DOOR_H, WHITE, DOOR_FRAME_SW, 1);
  s += drawStickFigure('', figureX, FIGURE_Y_BASE, 1, AMBER, figurePose, 1, u * 2);
  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var figureX = DOOR_X;
  var figurePose = 'stand';
  var crossOp = 0;

  var attempt1 = ramp(u, 0.1, 0.3); // Push wrong door
  var attempt2 = ramp(u, 0.4, 0.6); // Pull wrong door
  var fumbledSuccess = ramp(u, 0.7, 0.9);

  if (attempt1 > 0 && attempt1 < 1) {
    figurePose = 'struggle_push';
    figureX = lerp(DOOR_X - 100, DOOR_X - 100 + 30, smooth(attempt1));
    crossOp = pulse(u, 0.2, 0.1);
  } else if (attempt2 > 0 && attempt2 < 1) {
    figurePose = 'struggle_pull';
    figureX = lerp(DOOR_X + 100, DOOR_X + 100 - 30, smooth(attempt2));
    crossOp = pulse(u, 0.5, 0.1);
  } else if (fumbledSuccess > 0) {
    figurePose = 'confused';
    figureX = DOOR_X;
  }

  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += doorFrame(DOOR_X, DOOR_Y, DOOR_W, DOOR_H, WHITE, DOOR_FRAME_SW, 1);
  s += pushPlate(DOOR_X - DOOR_W/2 + 30, DOOR_Y, 60, 100, WHITE, 1); // White push plate
  s += pullHandle(DOOR_X + DOOR_W/2 - 30, DOOR_Y, 20, 100, CORAL, 8, 1); // Coral pull handle

  var currentFigureX = figureX;
  if (attempt1 > 0 && attempt1 < 1) currentFigureX = lerp(DOOR_X - 100, DOOR_X - 100 + 30, smooth(attempt1));
  else if (attempt2 > 0 && attempt2 < 1) currentFigureX = lerp(DOOR_X + 100, DOOR_X + 100 - 30, smooth(attempt2));
  else currentFigureX = DOOR_X;

  s += drawStickFigure('', currentFigureX, FIGURE_Y_BASE, 1, AMBER, figurePose, 1, u * 2);
  if (crossOp > 0.05) {
    s += crossMark(currentFigureX, FIGURE_Y_BASE - FIGURE_H_APPROX / 2 - 50, 40, CORAL, crossOp);
  }
  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH */
function scene3(u) {
  var s = '';
  var zoom = lerp(1.0, 1.1, smooth(ramp(u, 0.1, 0.5)));
  var qOp = pulse(u, 0.5, 0.4);
  var qYOffset = Math.sin(u * Math.PI * 4) * 8;

  s += '<g ' + camera(zoom, 0, 0) + '>';
  s += doorFrame(DOOR_X, DOOR_Y, DOOR_W, DOOR_H, WHITE, DOOR_FRAME_SW, 1);
  s += pushPlate(DOOR_X - DOOR_W/2 + 30, DOOR_Y, 60, 100, WHITE, 1);
  s += pullHandle(DOOR_X + DOOR_W/2 - 30, DOOR_Y, 20, 100, CORAL, 8, 1);

  s += drawStickFigure('', DOOR_X, FIGURE_Y_BASE, 1, AMBER, 'confused', 1, 0);
  if (qOp > 0.05) {
    s += questionMark(DOOR_X, DOOR_Y - 200 + qYOffset, 80, CORAL, qOp);
  }
  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND */
function scene4(u) {
  var s = '';
  var qOpDissolve = 1 - smooth(ramp(u, 0.0, 0.2));
  var doorMorph = smooth(ramp(u, 0.1, 0.4));
  var emerW = lerp(DOOR_W, DOOR_W * 1.6, doorMorph);
  var emerH = lerp(DOOR_H, DOOR_H * 1.1, doorMorph);
  var emerCol = lerpColor(WHITE, BLUE, doorMorph);
  var emerSW = lerp(DOOR_FRAME_SW, 12, doorMorph);
  var barOp = ramp(u, 0.4, 0.6);

  s += '<g ' + camera(1.0, 0, 0) + '>';
  if (qOpDissolve > 0.05) {
    s += questionMark(DOOR_X, DOOR_Y - 200, 80, CORAL, qOpDissolve);
  }

  s += doorFrame(DOOR_X, DOOR_Y, emerW, emerH, emerCol, emerSW, 1);
  s += pushPlate(DOOR_X - DOOR_W/2 + 30, DOOR_Y, 60, 100, WHITE, 1 - doorMorph);
  s += pullHandle(DOOR_X + DOOR_W/2 - 30, DOOR_Y, 20, 100, CORAL, 8, 1 - doorMorph);

  if (barOp > 0.05) {
    s += emergencyBar(DOOR_X, DOOR_Y + emerH/2 - 100, emerW * 0.8, 40, WHITE, barOp);
  }

  var flowSpeed = 200;
  var numFigures = 5;
  for (var i = 0; i < numFigures; i++) {
    var p = (u * flowSpeed + rnd(i) * 100) % (emerH + 200);
    var figY = DOOR_Y + emerH/2 + 100 - p;
    if (figY > DOOR_Y - emerH/2 - 50 && figY < BOT) {
      s += drawStickFigure('', DOOR_X + rnd(i + 10) * 80 - 40, figY, 0.8, WHITE, 'through', ramp(figY, DOOR_Y + emerH/2 + 100, DOOR_Y - emerH/2 - 50), u * 2);
    }
  }

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE */
function scene5(u) {
  var s = '';
  var zoom = lerp(1.0, 1.3, smooth(ramp(u, 0.0, 0.4)));
  var panY = lerp(0, 100, smooth(ramp(u, 0.0, 0.4)));
  var emerW = DOOR_W * 1.6;
  var emerH = DOOR_H * 1.1;

  s += '<g ' + camera(zoom, 0, panY) + '>';
  s += doorFrame(DOOR_X, DOOR_Y, emerW, emerH, BLUE, 12, 1);
  s += emergencyBar(DOOR_X, DOOR_Y + emerH/2 - 100, emerW * 0.8, 40, WHITE, 1);

  var coralFigX = DOOR_X - emerW/2 - 80;
  var coralFigY = FIGURE_Y_BASE + 50;
  var coralStruggle = Math.sin(u * Math.PI * 6) * 5;
  s += drawStickFigure('', coralFigX + coralStruggle, coralFigY, 0.6, CORAL, 'struggle_push', 1, u * 2);

  var flowSpeed = 200;
  var numFigures = 5;
  for (var i = 0; i < numFigures; i++) {
    var p = (u * flowSpeed + rnd(i) * 100) % (emerH + 200);
    var figY = DOOR_Y + emerH/2 + 100 - p;
    var figX = DOOR_X + rnd(i + 10) * 80 - 40;
    if (figY > DOOR_Y - emerH/2 - 50 && figY < BOT) {
      s += drawStickFigure('', figX, figY, 0.8, WHITE, 'through', ramp(figY, DOOR_Y + emerH/2 + 100, DOOR_Y - emerH/2 - 50), u * 2);
    }
  }
  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE */
function scene6(u) {
  var s = '';
  var reform = smooth(ramp(u, 0.5, 0.8));
  var figureStartX = DOOR_X + 200;
  var figureApproachX = DOOR_X + 100;
  var figurePushX = DOOR_X + 100 - 30;
  var figureThroughX = DOOR_X + 100 + 100;

  var figureX = lerp(figureStartX, figureApproachX, easeOut(ramp(u, 0.0, 0.2)));
  var doorOpenAmount = 0;
  var figurePose = 'observe';

  if (u > 0.2 && u <= 0.4) {
    figureX = lerp(figureApproachX, figurePushX, easeOut(ramp(u, 0.2, 0.4)));
    figurePose = 'push';
  } else if (u > 0.4 && u <= 0.6) {
    figureX = figurePushX;
    figurePose = 'push';
    doorOpenAmount = easeOut(ramp(u, 0.4, 0.6));
  } else if (u > 0.6) {
    figureX = lerp(figurePushX, figureThroughX, easeOut(ramp(u, 0.6, 0.9)));
    figurePose = 'through';
    doorOpenAmount = 1;
  }

  s += '<g ' + camera(1.0, 0, 0) + '>';
  var emerW = DOOR_W * 1.6;
  var emerH = DOOR_H * 1.1;
  var doorW = lerp(emerW, DOOR_W, reform);
  var doorH = lerp(emerH, DOOR_H, reform);
  var doorCol = lerpColor(BLUE, WHITE, reform);
  var doorSW = lerp(12, DOOR_FRAME_SW, reform);

  if (reform < 0.9) {
    s += doorFrame(DOOR_X, DOOR_Y, doorW, doorH, doorCol, doorSW, 1);
    s += emergencyBar(DOOR_X, DOOR_Y + emerH/2 - 100, emerW * 0.8, 40, WHITE, 1 - reform);
  } else {
    s += doorOpeningFrame(DOOR_X, DOOR_Y, DOOR_W, DOOR_H, doorOpenAmount, WHITE, DOOR_FRAME_SW, 1);
  }

  var pushPlateOp = ramp(u, 0.3, 0.5);
  s += pushPlate(DOOR_X - DOOR_W/2 + 30, DOOR_Y, 60, 100, BLUE, pushPlateOp);

  s += drawStickFigure('', figureX, FIGURE_Y_BASE, 1, AMBER, figurePose, 1, u * 2);
  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
