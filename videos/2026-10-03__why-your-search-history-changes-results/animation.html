<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Your Search History Changes Your Search Results</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey
var BLUE  = "#4C86F0";              // signal blue  -> the system / algorithm
var AMBER = "#F2A93B";              // warm amber   -> YOU / user
var CORAL = "#FF5B5B";              // coral red    -> filter bubble / biased results

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op, fill) {
  return '<path d="' + d + '" fill="' + (fill ? fill : 'none') + '" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

// Custom stick figure
function stickFigure(x, y, col, pose, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '" stroke="' + col + '" stroke-width="8" stroke-linecap="round">';
  var headR = 26;
  var bodyLen = 100;
  var armLen = 60;
  var legLen = 80;

  // Head
  g += dot(x, y - bodyLen / 2 - headR, headR, col);

  // Body
  g += line(x, y - bodyLen / 2, x, y + bodyLen / 2, col, 8);

  // Arms
  if (pose === 'typing') {
    g += line(x, y - bodyLen / 2 + 20, x - armLen, y + 10, col, 8); // Left arm down
    g += line(x, y - bodyLen / 2 + 20, x + armLen, y + 10, col, 8); // Right arm down
  } else if (pose === 'tap') {
    g += line(x, y - bodyLen / 2 + 20, x - armLen * 0.7, y + 10, col, 8); // Left arm down
    g += line(x, y - bodyLen / 2 + 20, x + armLen * 1.2, y - 30, col, 8); // Right arm extended to tap
  } else if (pose === 'confused') {
    g += line(x, y - bodyLen / 2 + 20, x - armLen * 0.7, y + 10, col, 8); // Left arm down
    g += line(x, y - bodyLen / 2 + 20, x + armLen * 0.3, y - 10, col, 8); // Right arm up
    g += line(x + armLen * 0.3, y - 10, x + armLen * 0.3 + 20, y - bodyLen / 2 - headR - 10, col, 8); // Hand to head
  } else if (pose === 'understanding') {
    g += line(x, y - bodyLen / 2 + 20, x - armLen * 0.7, y + 10, col, 8); // Left arm relaxed
    g += line(x, y - bodyLen / 2 + 20, x + armLen * 0.7, y + 10, col, 8); // Right arm relaxed
    g += line(x, y - bodyLen / 2 - headR, x, y - bodyLen / 2 - headR - 10, col, 8); // Look up
  } else if (pose === 'poking') {
    g += line(x, y - bodyLen / 2 + 20, x - armLen * 0.7, y + 10, col, 8); // Left arm relaxed
    g += line(x, y - bodyLen / 2 + 20, x + armLen * 1.2, y - 10, col, 8); // Right arm extended to poke
  } else { // default: standing/calm
    g += line(x, y - bodyLen / 2 + 20, x - armLen, y + bodyLen / 2 - 20, col, 8);
    g += line(x, y - bodyLen / 2 + 20, x + armLen, y + bodyLen / 2 - 20, col, 8);
  }

  // Legs (seated)
  g += line(x, y + bodyLen / 2, x - legLen * 0.6, y + bodyLen / 2 + 30, col, 8);
  g += line(x, y + bodyLen / 2, x + legLen * 0.6, y + bodyLen / 2 + 30, col, 8);

  g += '</g>';
  return g;
}

// Desk and keyboard
function deskAndKeyboard(deskX, deskY, deskW, deskH, keyW, keyH, col, op) {
  var s = '';
  s += rrect(deskX, deskY, deskW, deskH, 12, col, op);
  s += rrect(deskX, deskY - deskH / 2 + 20, keyW, keyH, 8, col, op); // Keyboard
  for (var i = 0; i < 4; i++) {
    for (var j = 0; j < 6; j++) {
      s += dot(deskX - keyW / 2 + 20 + j * 20, deskY - deskH / 2 + 10 + 20 + i * 20, 4, DIM, op * 0.6); // Keys
    }
  }
  return s;
}

// Search bar
function searchBar(x, y, w, h, rad, col, sw, op) {
  return rrectStroke(x, y, w, h, rad, col, sw, op);
}

// Result block
function resultBlock(x, y, w, h, rad, col, op, sw) {
  sw = sw == null ? 0 : sw;
  if (sw > 0) {
    return rrectStroke(x, y, w, h, rad, col, sw, op);
  }
  return rrect(x, y, w, h, rad, col, op);
}

// Helper for color lerping (simple RGB)
function lerpColor(a, b, t) {
  var hexToRgb = function(hex) {
    var r = parseInt(hex.substring(1, 3), 16);
    var g = parseInt(hex.substring(3, 5), 16);
    var b = parseInt(hex.substring(5, 7), 16);
    return [r, g, b];
  };
  var rgbToHex = function(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  };

  var rgbA = hexToRgb(a);
  var rgbB = hexToRgb(b);

  var r = Math.round(lerp(rgbA[0], rgbB[0], t));
  var g = Math.round(lerp(rgbA[1], rgbB[1], t));
  var b = Math.round(lerp(rgbA[2], rgbB[2], t));

  return rgbToHex(r, g, b);
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

var SF_X = CX - 300, SF_Y = BOT - 200; // Stick figure position
var DESK_W = 380, DESK_H = 160;
var DESK_X = SF_X + DESK_W / 2 + 60, DESK_Y = SF_Y + DESK_H / 2 + 40;
var KEY_W = 140, KEY_H = 80;

var SB_X = CX, SB_Y = TOP + 100; // Search bar position
var SB_W = 600, SB_H = 80;

var RES_W = 220, RES_H = 100, RES_RAD = 12;
var RES_START_Y = SB_Y + SB_H / 2 + 80;

// Grid positions for results
var GRID_COLS = 3;
var GRID_ROWS = 4;
var GRID_GAP_X = 20;
var GRID_GAP_Y = 20;
var GRID_START_X = CX - (GRID_COLS * RES_W + (GRID_COLS - 1) * GRID_GAP_X) / 2 + RES_W / 2;
var GRID_START_Y_OFFSET = RES_START_Y;

function getGridPos(col, row) {
  return {
    x: GRID_START_X + col * (RES_W + GRID_GAP_X),
    y: GRID_START_Y_OFFSET + row * (RES_H + GRID_GAP_Y)
  };
}


/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = ramp(u, 0.0, 0.3);
  var res_fade_start = 0.2;
  var res_fade_end = 0.8;

  s += stickFigure(SF_X, SF_Y, AMBER, 'typing', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);

  // Search bar appears
  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, WHITE, 8, sb_op);

  // Result blocks flow out
  for (var r = 0; r < GRID_ROWS; r++) {
    for (var c = 0; c < GRID_COLS; c++) {
      var idx = r * GRID_COLS + c;
      var block_u = ramp(u, res_fade_start + idx * 0.05, res_fade_end + idx * 0.05);
      var block_y_offset = lerp( - (BOT - TOP) / 2, 0, smooth(block_u));
      var block_op = block_u;

      var pos = getGridPos(c, r);
      s += resultBlock(pos.x, pos.y + block_y_offset, RES_W, RES_H, RES_RAD, WHITE, block_op);
    }
  }
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = 1;

  s += stickFigure(SF_X, SF_Y, AMBER, 'tap', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);
  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, WHITE, 8, sb_op);

  var tapped_idx = 4; // Let's say the middle-left block is tapped (row 1, col 1)
  var tapped_pos = getGridPos(1, 1); // col 1, row 1 (0-indexed)

  var expand_t = ramp(u, 0.1, 0.3);
  var expand_w = lerp(RES_W, RES_W * 1.1, easeOut(expand_t));
  var expand_h = lerp(RES_H, RES_H * 1.1, easeOut(expand_t));
  var glow_op = lerp(0, 0.7, easeOut(expand_t)) * (0.5 + 0.5 * Math.sin(u * Math.PI * 4));

  // Tapped block
  s += resultBlock(tapped_pos.x, tapped_pos.y, expand_w, expand_h, RES_RAD, AMBER, glow_op, 10); // Glow
  s += resultBlock(tapped_pos.x, tapped_pos.y, expand_w, expand_h, RES_RAD, WHITE, 1); // White block itself

  // New related blocks slide in, replacing some originals
  var new_blocks_indices = [5, 6, 7]; // Example indices for new blocks
  var new_blocks_start_y = TOP - 100; // Slide in from above
  
  for (var r = 0; r < GRID_ROWS; r++) {
    for (var c = 0; c < GRID_COLS; c++) {
      var idx = r * GRID_COLS + c;
      var pos = getGridPos(c, r);

      if (idx === tapped_idx) continue; // Skip the tapped block

      var block_op = 1;
      var block_y = pos.y;

      if (new_blocks_indices.includes(idx)) {
        // New blocks slide in
        var slide_t = ramp(u, 0.4, 0.7);
        block_y = lerp(new_blocks_start_y, pos.y, smooth(slide_t));
        s += resultBlock(pos.x, block_y, RES_W, RES_H, RES_RAD, WHITE, block_op);
      } else if (idx < tapped_idx || idx > tapped_idx + new_blocks_indices.length) {
        // Old, unrelated blocks slide out or fade
        var fade_out_t = ramp(u, 0.5, 0.8);
        block_op = lerp(1, 0, easeIn(fade_out_t));
        block_y = lerp(pos.y, pos.y + 100, easeIn(fade_out_t)); // Slide down slightly
        if (block_op > 0.05) {
          s += resultBlock(pos.x, block_y, RES_W, RES_H, RES_RAD, WHITE, block_op);
        }
      } else {
        // Remaining original blocks stay
        s += resultBlock(pos.x, pos.y, RES_W, RES_H, RES_RAD, WHITE, block_op);
      }
    }
  }
  return s;
}

/* SCENE 3 (20-30): SEARCH — is something targeting me? (funnel + coral beam on the OTHER lane) */
function scene3(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = 1;

  s += stickFigure(SF_X, SF_Y, AMBER, 'confused', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);
  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, WHITE, 8, sb_op);

  var tapped_idx = 4;
  var new_blocks_indices = [5, 6, 7];
  var coral_blocks_indices = [tapped_idx].concat(new_blocks_indices);

  var zoom_t = ramp(u, 0.4, 0.9);
  var camera_scale = lerp(1.0, 1.2, smooth(zoom_t));
  var camera_ty = lerp(0, -100, smooth(zoom_t)); // Zoom in on the result blocks

  s += '<g ' + camera(camera_scale, 0, camera_ty) + '>';

  for (var r = 0; r < GRID_ROWS; r++) {
    for (var c = 0; c < GRID_COLS; c++) {
      var idx = r * GRID_COLS + c;
      var pos = getGridPos(c, r);

      var block_op = 1;
      var block_w = RES_W;
      var block_h = RES_H;
      var block_col = WHITE;

      if (coral_blocks_indices.includes(idx)) {
        // These blocks turn coral red
        var coral_t = ramp(u, 0.1, 0.5);
        block_col = lerpColor(WHITE, CORAL, easeOut(coral_t));
        s += resultBlock(pos.x, pos.y, block_w, block_h, RES_RAD, block_col, block_op);
      } else {
        // Other diverse white blocks shrink and disappear
        var shrink_t = ramp(u, 0.2, 0.6);
        block_w = lerp(RES_W, 0, easeIn(shrink_t));
        block_h = lerp(RES_H, 0, easeIn(shrink_t));
        block_op = lerp(1, 0, easeIn(shrink_t));
        if (block_op > 0.05) { // Only draw if visible
          s += resultBlock(pos.x, pos.y, block_w, block_h, RES_RAD, block_col, block_op);
        }
      }
    }
  }

  // Clustered effect for coral blocks (slight movement/overlap)
  var cluster_t = ramp(u, 0.6, 0.9);
  var cluster_offset = lerp(0, 10, smooth(cluster_t));
  var cluster_center_x = getGridPos(1, 1).x; // Center around the tapped block
  var cluster_center_y = getGridPos(1, 1).y;

  coral_blocks_indices.forEach(function(idx, i) {
    var pos = getGridPos(idx % GRID_COLS, Math.floor(idx / GRID_COLS));
    var offsetX = (pos.x - cluster_center_x) * cluster_offset / RES_W;
    var offsetY = (pos.y - cluster_center_y) * cluster_offset / RES_H;
    s += resultBlock(pos.x + offsetX, pos.y + offsetY, RES_W, RES_H, RES_RAD, CORAL, 1);
  });

  s += '</g>';
  return s;
}


/* SCENE 4 (30-40): FIND — belts; slow lane passed for minutes, fast lane overtakes in seconds */
function scene4(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = 1;

  s += stickFigure(SF_X, SF_Y, AMBER, 'understanding', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);

  var sb_col = lerpColor(WHITE, BLUE, ramp(u, 0.5, 0.8));
  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, sb_col, 8, sb_op);

  var tapped_idx = 4;
  var new_blocks_indices = [5, 6, 7];
  var coral_blocks_indices = [tapped_idx].concat(new_blocks_indices);

  var flash_t = ramp(u, 0.0, 0.15); // Flash white
  var network_t = ramp(u, 0.2, 0.7); // Network emerges

  for (var r = 0; r < GRID_ROWS; r++) {
    for (var c = 0; c < GRID_COLS; c++) {
      var idx = r * GRID_COLS + c;
      var pos = getGridPos(c, r);

      var block_col = CORAL;
      if (coral_blocks_indices.includes(idx)) {
        block_col = lerpColor(CORAL, WHITE, easeOut(flash_t)); // Flash white
        s += resultBlock(pos.x, pos.y, RES_W, RES_H, RES_RAD, block_col, 1);
      }
    }
  }

  // Signal blue network emerges
  if (network_t > 0) {
    var network_op = network_t;
    var sb_center = { x: SB_X, y: SB_Y };

    coral_blocks_indices.forEach(function(idx) {
      var pos = getGridPos(idx % GRID_COLS, Math.floor(idx / GRID_COLS));
      s += line(sb_center.x, sb_center.y + SB_H / 2, pos.x, pos.y - RES_H / 2, BLUE, 4, network_op); // Line from search bar to block
      s += line(pos.x - RES_W / 2, pos.y, pos.x + RES_W / 2, pos.y, BLUE, 4, network_op); // Horizontal line across block
      s += line(pos.x, pos.y - RES_H / 2, pos.x, pos.y + RES_H / 2, BLUE, 4, network_op); // Vertical line across block
    });
    // Add some connecting lines between blocks
    for (var i = 0; i < coral_blocks_indices.length - 1; i++) {
      var pos1 = getGridPos(coral_blocks_indices[i] % GRID_COLS, Math.floor(coral_blocks_indices[i] / GRID_COLS));
      var pos2 = getGridPos(coral_blocks_indices[i+1] % GRID_COLS, Math.floor(coral_blocks_indices[i+1] / GRID_COLS));
      s += line(pos1.x, pos1.y, pos2.x, pos2.y, BLUE, 4, network_op * 0.7);
    }
  }

  return s;
}

/* SCENE 5 (40-50): TAKE — losing moments stack into a tall coral memory column */
function scene5(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = 1;

  s += stickFigure(SF_X, SF_Y, AMBER, 'calm', sf_op); // Stick figure inside the bubble
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);

  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, BLUE, 8, sb_op); // Search bar remains blue

  var tapped_idx = 4;
  var new_blocks_indices = [5, 6, 7];
  var coral_blocks_indices = [tapped_idx].concat(new_blocks_indices);
  var all_blocks_count = coral_blocks_indices.length;

  var bubble_t = ramp(u, 0.1, 0.8);
  var bubble_radius = lerp(0, 300, easeOut(bubble_t));
  var bubble_center_x = CX;
  var bubble_center_y = CY + 200; // Around the stick figure

  var block_stack_width = 200;
  var block_stack_height = 80;

  // Blue network pulses
  var pulse_op = 0.4 + 0.3 * Math.sin(u * Math.PI * 6);
  var sb_center = { x: SB_X, y: SB_Y };
  coral_blocks_indices.forEach(function(idx) {
    var pos = getGridPos(idx % GRID_COLS, Math.floor(idx / GRID_COLS));
    s += line(sb_center.x, sb_center.y + SB_H / 2, pos.x, pos.y - RES_H / 2, BLUE, 4, pulse_op);
    s += line(pos.x - RES_W / 2, pos.y, pos.x + RES_W / 2, pos.y, BLUE, 4, pulse_op);
    s += line(pos.x, pos.y - RES_H / 2, pos.x, pos.y + RES_H / 2, BLUE, 4, pulse_op);
  });

  // Result blocks stack and curve to form a circular wall
  var block_angle_step = (Math.PI * 2) / all_blocks_count;
  for (var i = 0; i < all_blocks_count; i++) {
    var block_u = ramp(u, 0.1 + i * 0.05, 0.7 + i * 0.05);
    var block_r = lerp(0, bubble_radius, smooth(block_u));
    var angle = i * block_angle_step + Math.PI / 2; // Start from the front

    var block_x = bubble_center_x + block_r * Math.cos(angle);
    var block_y = bubble_center_y + block_r * Math.sin(angle);

    var block_op = smooth(block_u);
    if (block_op > 0.05) {
      s += resultBlock(block_x, block_y, block_stack_width, block_stack_height, RES_RAD, WHITE, block_op, 6);
    }
  }

  // Inside bubble glows coral red
  var coral_glow_op = lerp(0, 0.2, easeOut(bubble_t));
  if (coral_glow_op > 0.01) {
    s += dot(bubble_center_x, bubble_center_y, bubble_radius * 0.9, CORAL, coral_glow_op);
  }

  // Draw the bubble outline (optional, for clarity)
  if (bubble_t > 0.01) {
    s += ring(bubble_center_x, bubble_center_y, bubble_radius, DIM, 4, bubble_t * 0.5);
  }

  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE — one shared finish line, then snap back to plain lanes */
function scene6(u) {
  var s = '';
  var sf_op = 1;
  var sb_op = 1;

  var bubble_center_x = CX;
  var bubble_center_y = CY + 200;
  var bubble_radius = 300;

  var poke_t = ramp(u, 0.1, 0.3);
  var shatter_t = ramp(u, 0.3, 0.6);

  // Stick figure inside the coral-glowing bubble, calm, then pokes
  s += stickFigure(SF_X, SF_Y, AMBER, poke_t > 0.01 ? 'poking' : 'calm', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);

  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, BLUE, 8, sb_op); // Search bar remains blue

  // Coral glow inside the bubble fades
  var coral_glow_op = lerp(0.2, 0, easeIn(shatter_t));
  if (coral_glow_op > 0.01) {
    s += dot(bubble_center_x, bubble_center_y, bubble_radius * 0.9, CORAL, coral_glow_op);
  }

  // Bubble wall
  var bubble_wall_op = lerp(1, 0, easeIn(shatter_t));
  if (bubble_wall_op > 0.01) {
    s += ring(bubble_center_x, bubble_center_y, bubble_radius, DIM, 4, bubble_wall_op * 0.5);
  }

  // Shatter effect
  if (shatter_t > 0) {
    var shatter_fragments = 10;
    for (var i = 0; i < shatter_fragments; i++) {
      var angle = rnd(i) * Math.PI * 2;
      var frag_x = bubble_center_x + bubble_radius * Math.cos(angle);
      var frag_y = bubble_center_y + bubble_radius * Math.sin(angle);
      var travel_dist = lerp(0, 100, easeOut(shatter_t));
      var frag_dx = Math.cos(angle) * travel_dist;
      var frag_dy = Math.sin(angle) * travel_dist;
      var frag_size = lerp(10, 0, easeIn(shatter_t));
      if (frag_size > 0.5) {
        s += rrect(frag_x + frag_dx, frag_y + frag_dy, frag_size, frag_size, 2, WHITE, lerp(1, 0, shatter_t));
      }
    }
  }

  // Reveal open, neutral white space beyond
  var reveal_t = ramp(u, 0.6, 0.9);
  var white_bg_op = lerp(0, 0.3, smooth(reveal_t));
  s += rrect(CX, CY, W, H, 0, WHITE, white_bg_op); // A large white rectangle covering the area

  // Camera pull back
  var camera_scale = lerp(1.0, 0.9, smooth(reveal_t));
  var camera_ty = lerp(0, -50, smooth(reveal_t));
  s += '<g ' + camera(camera_scale, 0, camera_ty) + '>';

  // Stick figure looks out with newfound awareness
  s += stickFigure(SF_X, SF_Y, AMBER, 'understanding', sf_op);
  s += deskAndKeyboard(DESK_X, DESK_Y, DESK_W, DESK_H, KEY_W, KEY_H, WHITE, sf_op);
  s += searchBar(SB_X, SB_Y, SB_W, SB_H, 16, BLUE, 8, sb_op); // Search bar remains blue

  s += '</g>';
  return s;
}


var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
