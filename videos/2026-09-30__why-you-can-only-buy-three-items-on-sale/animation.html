<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why You Can Only Buy Three Items on Sale</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)
var LX = 372, RX = 708;             // left / right lane x  (centre 540, +/-168)
var CARY = 1120;                    // "you" resting height

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> the system / the wave
var AMBER = "#F2A93B";              // warm amber   -> YOU / what you want
var CORAL = "#FF5B5B";              // coral red    -> the naive attempt/misunderstanding

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrectStroke(x, y, w, h, rad, col, sw, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="none" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
/* "SALE" sign icon: rectangle with "SALE" text (represented by glyphs) */
function saleSign(x, y, w, h, rad, col, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  g += rrect(x, y, w, h, rad, col);
  // Represent "SALE" with simple glyphs: S, A, L, E
  var glyphSize = Math.min(w, h) * 0.25;
  var glyphX = x - w/2 + glyphSize * 1.5;
  var glyphY = y;
  // S
  g += pathTag("M " + (glyphX - glyphSize) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize) + " " + (glyphY - glyphSize) + " L " + (glyphX - glyphSize) + " " + glyphY + " L " + (glyphX + glyphSize) + " " + glyphY + " L " + (glyphX - glyphSize) + " " + (glyphY + glyphSize) + " L " + (glyphX + glyphSize) + " " + (glyphY + glyphSize), WHITE, 6, 1);
  // A
  g += pathTag("M " + (glyphX + glyphSize * 2.5) + " " + (glyphY + glyphSize) + " L " + (glyphX + glyphSize * 1.5) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize * 0.5) + " " + (glyphY + glyphSize) + " L " + (glyphX + glyphSize * 1.5) + " " + glyphY, WHITE, 6, 1);
  // L
  g += pathTag("M " + (glyphX + glyphSize * 4) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize * 3) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize * 3) + " " + (glyphY + glyphSize), WHITE, 6, 1);
  // E
  g += pathTag("M " + (glyphX + glyphSize * 5.5) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize * 4.5) + " " + (glyphY - glyphSize) + " L " + (glyphX + glyphSize * 4.5) + " " + glyphY + " L " + (glyphX + glyphSize * 5.5) + " " + glyphY + " L " + (glyphX + glyphSize * 4.5) + " " + glyphY + " L " + (glyphX + glyphSize * 4.5) + " " + (glyphY + glyphSize) + " L " + (glyphX + glyphSize * 5.5) + " " + (glyphY + glyphSize), WHITE, 6, 1);
  g += '</g>';
  return g;
}
/* "LIMIT 3" icon: circle with a number 3 inside (represented by glyphs) */
function limitIcon(x, y, r, col, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  g += ring(x, y, r, col, 6);
  // Represent '3' with simple glyphs
  var glyphSize = r * 0.5;
  var glyphX = x;
  var glyphY = y - glyphSize * 0.2;
  g += pathTag("M " + (glyphX - glyphSize * 0.6) + " " + (glyphY - glyphSize * 0.8) + " C " + (glyphX + glyphSize * 0.6) + " " + (glyphY - glyphSize * 0.8) + ", " + (glyphX + glyphSize * 0.8) + " " + (glyphY - glyphSize * 0.4) + ", " + (glyphX + glyphSize * 0.8) + " " + glyphY + " C " + (glyphX + glyphSize * 0.8) + " " + (glyphY + glyphSize * 0.4) + ", " + (glyphX + glyphSize * 0.6) + " " + (glyphY + glyphSize * 0.8) + ", " + (glyphX - glyphSize * 0.6) + " " + (glyphY + glyphSize * 0.8) + " C " + (glyphX - glyphSize * 0.8) + " " + (glyphY + glyphSize * 0.8) + ", " + (glyphX - glyphSize * 0.8) + " " + (glyphY + glyphSize * 0.4) + ", " + (glyphX - glyphSize * 0.6) + " " + glyphY + " C " + (glyphX - glyphSize * 0.8) + " " + (glyphY - glyphSize * 0.4) + ", " + (glyphX - glyphSize * 0.6) + " " + (glyphY - glyphSize * 0.8) + ", " + (glyphX - glyphSize * 0.6) + " " + (glyphY - glyphSize * 0.8), WHITE, 8, 1);
  g += '</g>';
  return g;
}
/* the "you" stick figure with a shopping cart */
function shopper(x, y, cartCol, cartItems, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  // Stick figure
  g += dot(x, y - 70, 18, AMBER); // Head
  g += line(x, y - 52, x, y - 12, AMBER, 8); // Torso
  g += line(x, y - 40, x - 24, y - 10, AMBER, 8); // Left arm
  g += line(x, y - 40, x + 24, y - 10, AMBER, 8); // Right arm
  g += line(x, y, x - 24, y + 40, AMBER, 8); // Left leg
  g += line(x, y, x + 24, y + 40, AMBER, 8); // Right leg

  // Shopping cart
  var cartW = 70, cartH = 40, cartRad = 10;
  var cartX = x + 40, cartY = y + 20;
  g += rrect(cartX, cartY, cartW, cartH, cartRad, cartCol, 1);
  g += rrectStroke(cartX, cartY, cartW, cartH, cartRad, WHITE, 4, 0.6);

  // Cart items
  if (cartItems === 'coral') {
    var itemSize = 16, itemSpacing = 24;
    for (var i = 0; i < 5; i++) {
      g += dot(cartX - cartW/2 + 18 + i * itemSpacing, cartY - cartH/2 - 10, itemSize, CORAL, 0.9);
    }
  } else if (cartItems === 'blue') {
    var itemSize = 16, itemSpacing = 24;
    for (var i = 0; i < 3; i++) {
      g += dot(cartX - cartW/2 + 18 + i * itemSpacing, cartY - cartH/2 - 10, itemSize, BLUE, 0.9);
    }
  }
  g += '</g>';
  return g;
}
/* persistent faint lane tracks behind every scene (hero element, always present) */
function guideTracks(op) {
  op = (op == null ? 0.16 : op);
  return rrect(LX, (TOP + BOT) / 2, 96, BOT - TOP, 48, BLUE, op) +
         rrect(RX, (TOP + BOT) / 2, 96, BOT - TOP, 48, BLUE, op);
}
/* scrolling dashed road markers down a lane — constant motion cue.
   phase in [0,1) shifts the pattern; speed multiplies visually via phase rate. */
function laneDashes(x, phase, col, op) {
  var g = '', gap = 150, dash = 66, span = BOT - TOP;
  var off = (phase % 1) * gap;
  for (var y = TOP - gap + off; y < BOT; y += gap) {
    var a = Math.max(y, TOP), b = Math.min(y + dash, BOT);
    if (b > a) g += line(x, a, x, b, col, 8, op);
  }
  return g;
}
/* thin horizon perspective lines converging upward — depth for the 9:16 frame */
function perspective(op) {
  op = (op == null ? 0.12 : op);
  var vy = 60;
  return line(LX, BOT, CX - 30, vy, WHITE, 2, op) +
         line(RX, BOT, CX + 30, vy, WHITE, 2, op) +
         line(LX - 150, BOT, CX - 90, vy, WHITE, 2, op * 0.6) +
         line(RX + 150, BOT, CX + 90, vy, WHITE, 2, op * 0.6);
}
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';
  s += perspective(0.10);
  s += guideTracks();
  var fade = ramp(u, 0.0, 0.3);
  s += line(LX, TOP, LX, BOT, WHITE, 7, 0.85 * (0.5 + 0.5 * fade));
  s += line(RX, TOP, RX, BOT, WHITE, 7, 0.85 * (0.5 + 0.5 * fade));
  // scrolling markers — constant motion from frame 0
  s += laneDashes(LX, u * 1.6, WHITE, 0.22);
  s += laneDashes(RX, u * 1.6 + 0.4, WHITE, 0.22);
  // other-lane traffic, evenly seeded, gently drifting
  for (var i = 0; i < 6; i++) {
    var y = BOT - 90 - i * 260 - u * 50 + rnd(i) * 40;
    while (y < TOP) y += (BOT - TOP);
    s += dot(RX, y, 15, DIM, 0.9);
  }
  var bob = Math.sin(u * Math.PI * 3) * 5;
  s += shopper(LX, CARY + bob, AMBER, null, 1); // Empty cart initially
  // "need": a rising stream of glyphs ahead of the figure
  for (var c = 0; c < 3; c++) {
    var cp = (u * 2 + c / 3) % 1;
    s += pathTag("M " + (LX - 10) + " " + (CARY - 96 - cp * 150) + " L " + (LX + 10) + " " + (CARY - 96 - cp * 150), AMBER, 14, (1 - cp) * 0.7);
  }
  // SALE and LIMIT 3 icons
  s += saleSign(CX - 150, 250, 200, 80, 20, CORAL, 0.9);
  s += limitIcon(CX + 150, 250, 50, BLUE, 0.9);
  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var shake = Math.sin(u * 42) * 3 * pulse(u, 0.18, 0.14);
  s += '<g ' + camera(1.0, shake, 0) + '>';
  s += guideTracks();
  s += line(LX, TOP, LX, BOT, WHITE, 7, 0.85);
  s += line(RX, TOP, RX, BOT, WHITE, 7, 0.85);

  s += laneDashes(LX, u * 2.2, WHITE, 0.20);
  s += laneDashes(RX, u * 3.4, WHITE, 0.20);

  var hop = smooth(ramp(u, 0.10, 0.26));
  var carX = lerp(LX, RX, hop);
  var carLift = Math.sin(hop * Math.PI) * 30;
  // curved hop trail
  if (hop > 0.02 && hop < 0.99) {
    s += pathTag("M " + LX + " " + (CARY + 10) + " Q " + CX + " " + (CARY - 90) + " " + carX + " " + (CARY - carLift), AMBER, 4, 0.35);
  }

  for (var i = 0; i < 6; i++) {
    var yr = BOT - 60 - i * 260 - u * 150 + rnd(i) * 50;
    while (yr < TOP) yr += (BOT - TOP);
    s += dot(RX, yr, 15, DIM, 0.9);
  }
  var surge = easeIn(ramp(u, 0.34, 1.0));
  for (var j = 0; j < 6; j++) {
    var base = BOT - 80 - j * 260 - rnd(j + 9) * 60;
    var yl = base - surge * 1150;
    if (yl > TOP - 60 && yl < BOT + 60) {
      s += line(LX, yl + 18, LX, yl + 18 + 60 * surge, WHITE, 6, 0.4);   // motion streak
      s += dot(LX, yl, 15, WHITE, 0.95);
    }
  }
  s += shopper(carX, CARY - carLift, AMBER, 'coral', 1); // Cart filling with coral items
  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH — barrier appears */
function scene3(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  s += guideTracks();
  var bend = smooth(ramp(u, 0.06, 0.42)) * (1 - smooth(ramp(u, 0.74, 1.0)));
  var midY = CARY;
  var pinch = bend * 150;
  var dL = "M " + LX + " " + TOP + " Q " + (LX + pinch) + " " + midY + " " + LX + " " + BOT;
  var dR = "M " + RX + " " + TOP + " Q " + (RX - pinch) + " " + midY + " " + RX + " " + BOT;
  s += pathTag(dL, WHITE, 7, 0.85);
  s += pathTag(dR, WHITE, 7, 0.85);
  s += laneDashes(LX, u * 1.4, WHITE, 0.16 * (1 - bend));
  s += laneDashes(RX, u * 1.4 + 0.5, WHITE, 0.16 * (1 - bend));

  // Coral red barrier
  var barrierHeight = 120;
  var barrierY = CARY - 10;
  var barrierX = LX + 30; // Positioned near the cart's path
  var barrierOpacity = ramp(u, 0.3, 0.7);
  if (barrierOpacity > 0.01) {
    s += rrect(barrierX, barrierY, 160, barrierHeight, 10, CORAL, barrierOpacity * 0.8);
    s += rrectStroke(barrierX, barrierY, 160, barrierHeight, 10, WHITE, 5, barrierOpacity);
    // 'X' glyph on barrier
    var xSize = 30;
    s += line(barrierX - xSize, barrierY - xSize, barrierX + xSize, barrierY + xSize, WHITE, 8, barrierOpacity);
    s += line(barrierX - xSize, barrierY + xSize, barrierX + xSize, barrierY - xSize, WHITE, 8, barrierOpacity);
  }

  for (var i = 0; i < 5; i++) {
    s += dot(LX, BOT - 100 - i * 320 - u * 70 + rnd(i) * 40, 14, DIM, 0.8);
    s += dot(RX, BOT - 200 - i * 320 - u * 100 + rnd(i + 4) * 40, 14, DIM, 0.8);
  }
  s += shopper(RX, CARY, AMBER, 'coral', 1); // Cart still overflowing
  s += line(RX, CARY - 58, RX + 6, CARY - 86, WHITE, 7, 0.9);           // gaze up in confusion
  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND — system overlay, bulk buyers */
function scene4(u) {
  var s = '';
  s += '<g ' + camera(1.0, 0, 0) + '>';
  var bw = lerp(96, 150, smooth(ramp(u, 0.0, 0.26)));
  s += rrect(LX, (TOP + BOT) / 2, bw, BOT - TOP, bw / 2, BLUE, 0.34);
  s += rrect(RX, (TOP + BOT) / 2, bw, BOT - TOP, bw / 2, BLUE, 0.34);
  s += line(LX, TOP, LX, BOT, WHITE, 4, 0.30);
  s += line(RX, TOP, RX, BOT, WHITE, 4, 0.30);

  var swap = smooth(ramp(u, 0.48, 0.60));              // 0 = bulk buyers active, 1 = regular shopper
  var speedL = lerp(1150, 240, swap);
  var countL = Math.round(lerp(9, 3, swap));
  var speedR = lerp(150, 1500, swap);
  var countR = Math.round(lerp(3, 8, swap));

  // Bulk buyers (left lane)
  for (var i = 0; i < countL; i++) {
    var pL = (u * (speedL / 820) + rnd(i)) % 1;
    var yl = lerp(BOT, TOP, pL);
    s += line(LX, yl + 16, LX, yl + 16 + 74, CORAL, 9, 0.9);           // coral streak = items taken by bulk buyers
    s += dot(LX, yl, 15, WHITE, 0.95);
  }
  // Regular shopper items (right lane)
  for (var j = 0; j < countR; j++) {
    var pR = (u * (speedR / 820) + rnd(j + 20)) % 1;
    var yr = lerp(BOT, TOP, pR);
    if (swap > 0.4) s += line(RX, yr + 14, RX, yr + 14 + 70 * swap, WHITE, 6, 0.45);
    s += dot(RX, yr, 15, WHITE, 0.9);
  }

  // System overlay explanation
  var systemOverlayOpacity = ramp(u, 0.2, 0.8);
  if (systemOverlayOpacity > 0.01) {
      s += rrect(CX, CY, W * 0.9, H * 0.8, 40, BLUE, systemOverlayOpacity * 0.1);
      // Stick figures representing bulk buyers
      for (var k = 0; k < 4; k++) {
          var bulkX = LX + 100 + k * 60 + rnd(k) * 40;
          var bulkY = BOT - 100 - k * 120 - u * 100 + rnd(k+10) * 30;
          s += shopper(bulkX, bulkY, CORAL, 'coral', systemOverlayOpacity * 0.8); // Bulk buyers have coral carts
      }
      // Stick figure representing regular shopper finding nothing
      var shopperX = RX - 60;
      var shopperY = BOT - 100 - u * 100;
      s += shopper(shopperX, shopperY, AMBER, null, systemOverlayOpacity * 0.8); // Regular shopper has empty cart
      s += line(shopperX, shopperY - 58, shopperX + 6, shopperY - 86, WHITE, 7, systemOverlayOpacity * 0.9); // Gaze up in confusion
      // Coral red 'X' over remaining items for regular shopper
      s += line(RX - 30, BOT - 120, RX + 30, BOT - 60, CORAL, 12, systemOverlayOpacity * 0.9);
      s += line(RX - 30, BOT - 60, RX + 30, BOT - 120, CORAL, 12, systemOverlayOpacity * 0.9);
  }

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE — cart transforms, holds blue items */
function scene5(u) {
  var s = '';
  var scale = lerp(1.0, 0.8, smooth(u));
  s += '<g ' + camera(scale, 0, lerp(0, 90, smooth(u))) + '>';
  s += rrect(LX, (TOP + BOT) / 2, lerp(150, 90, smooth(u)), BOT - TOP, 45, BLUE, lerp(0.34, 0.12, smooth(u)));
  s += rrect(RX, (TOP + BOT) / 2, lerp(150, 90, smooth(u)), BOT - TOP, 45, BLUE, lerp(0.34, 0.12, smooth(u)));
  s += line(LX, TOP, LX, BOT, WHITE, 4, 0.25 * (1 - smooth(u)));
  s += line(RX, TOP, RX, BOT, WHITE, 4, 0.25 * (1 - smooth(u)));

  var reform = smooth(ramp(u, 0.05, 0.82)); // Cart transformation progress

  // Coral items dissolving
  var coralDissolveOpacity = ramp(u, 0.1, 0.6);
  if (coralDissolveOpacity > 0.01) {
    for (var i = 0; i < 5; i++) {
      var itemY = CARY + 10 - i * 24;
      var itemX = LX + 40 + i * 24;
      s += dot(itemX, itemY, 16, CORAL, coralDissolveOpacity * (1 - i * 0.1));
    }
  }

  // Cart transformation and blue items
  var cartCol = lerp(CORAL, AMBER, reform);
  var cartItems = reform < 0.5 ? 'coral' : 'blue';
  s += shopper(CX - 100, CARY + 30, cartCol, cartItems, 1);

  // Subtle blue items in the cart
  if (reform > 0.5) {
    for (var i = 0; i < 3; i++) {
      s += dot(CX - 100 + 40 + i * 24, CARY + 30 - 40 - 10, 16, BLUE, 0.9);
    }
  }

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE — satisfied shopper, understood icon */
function scene6(u) {
  var s = '';
  var scale = lerp(0.8, 0.92, smooth(clamp(u / 0.7, 0, 1)));
  s += '<g ' + camera(scale, 0, lerp(90, 0, smooth(u))) + '>';

  var reform = smooth(ramp(u, 0.58, 0.86));
  var finishY = 1180;
  var conv = 1 - reform;

  s += guideTracks(0.10 + 0.10 * reform);

  if (conv > 0.02) {
    var dL = "M " + LX + " " + BOT + " Q " + LX + " " + (finishY + 140) + " " + CX + " " + finishY;
    var dR = "M " + RX + " " + BOT + " Q " + RX + " " + (finishY + 140) + " " + CX + " " + finishY;
    s += pathTag(dL, BLUE, lerp(64, 8, reform), 0.4 * conv + 0.15);
    s += pathTag(dR, BLUE, lerp(64, 8, reform), 0.4 * conv + 0.15);
    s += line(CX - 250 * conv, finishY, CX + 250 * conv, finishY, WHITE, 9, conv);
  }
  if (reform > 0.02) {
    s += line(LX, TOP, LX, BOT, WHITE, 7, 0.85 * reform);
    s += line(RX, TOP, RX, BOT, WHITE, 7, 0.85 * reform);
  }

  var arr = smooth(clamp(u / 0.5, 0, 1));
  if (reform < 0.5) {
    var carArrX = lerp(CX - 360, CX, arr), carArrY = lerp(BOT - 40, finishY, arr);
    var rivalX = lerp(CX + 360, CX, arr), rivalY = lerp(BOT - 40, finishY, arr);
    s += dot(rivalX, rivalY, 16, WHITE, 1);
    s += shopper(carArrX, carArrY, AMBER, null, 1); // Empty cart for final walk away
    if (arr > 0.9) s += ring(CX, finishY, 40 + (u - 0.5) * 300, WHITE, 5, clamp(1.2 - (u - 0.5) * 3, 0, 0.6));
  } else {
    var restX = lerp(CX, LX, reform), restY = lerp(finishY, CARY, reform);
    s += shopper(restX, restY, AMBER, null, 1); // Final amber cart
    s += line(restX, restY - 118, restX + 6, restY - 86, WHITE, 7, 0.7 * reform); // Gaze satisfied
  }

  // Final LIMIT 3 icon, understood
  if (u > 0.8) {
    s += limitIcon(CX + 200, 300, 60, BLUE, ramp(u, 0.8, 1.0));
  }
  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; }
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500);
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
