<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Cities Have One-Way Streets</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #wrap { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: #000; }
  svg { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
    <g id="stage"></g>
  </svg>
</div>
<script>
"use strict";

/* ---------- constants ---------- */
var W = 1080, H = 1920;
var CX = 540, CY = 960;
var TOP = 160, BOT = 1760;           // platform-safe vertical band (~8%)

var WHITE = "#FFFFFF";
var DIM   = "#8A93A6";              // muted grey for secondary dots
var BLUE  = "#4C86F0";              // signal blue  -> the system / rules / optimized flow
var AMBER = "#F2A93B";              // warm amber   -> YOU / desire / your car
var CORAL = "#FF5B5B";              // coral red    -> naive model / frustration / arbitrary block

var DUR = 60;
window.__duration = DUR;

/* ---------- math helpers ---------- */
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeOut(x) { x = clamp(x, 0, 1); return 1 - (1 - x) * (1 - x); }
function easeIn(x) { x = clamp(x, 0, 1); return x * x; }
function rnd(i) { var s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
function ramp(x, a, b) { return smooth((x - a) / (b - a)); }
function pulse(x, c, w) { var d = Math.abs(x - c) / w; return d >= 1 ? 0 : (1 - d); }

/* ---------- shape builders ---------- */
function line(x1, y1, x2, y2, col, sw, op) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
         '" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" opacity="' + (op == null ? 1 : op) + '"/>';
}
function dot(x, y, r, col, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function ring(x, y, r, col, sw, op) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + col +
         '" stroke-width="' + sw + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function rrect(x, y, w, h, rad, col, op) {
  return '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h +
         '" rx="' + rad + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
}
function pathTag(d, col, sw, op) {
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
         '" stroke-linecap="round" stroke-linejoin="round" opacity="' + (op == null ? 1 : op) + '"/>';
}

/* Stick figure car: wide rounded body + driver head + two wheels */
function car(x, y, col, op) {
  op = (op == null ? 1 : op);
  var g = '<g opacity="' + op + '">';
  g += '<rect x="' + (x - 66) + '" y="' + (y - 34) + '" width="132" height="76" rx="22" fill="none" stroke="' + col + '" stroke-width="10"/>';
  g += dot(x, y - 58, 17, col);                       // driver head
  g += dot(x - 42, y + 46, 11, col);                  // wheels
  g += dot(x + 42, y + 46, 11, col);
  g += '</g>';
  return g;
}

/* A simple city grid: horizontal and vertical lines */
function cityGrid(cx, cy, width, height, rows, cols, col, sw, op) {
  var s = '';
  var startX = cx - width / 2;
  var startY = cy - height / 2;
  var colStep = width / cols;
  var rowStep = height / rows;

  for (var i = 0; i <= cols; i++) {
    s += line(startX + i * colStep, startY, startX + i * colStep, startY + height, col, sw, op);
  }
  for (var j = 0; j <= rows; j++) {
    s += line(startX, startY + j * rowStep, startX + width, startY + j * rowStep, col, sw, op);
  }
  return s;
}

/* One-way arrow glyph (rectangle with a triangle) */
// direction: 'up', 'down', 'left', 'right'
function oneWayArrow(x, y, size, direction, col, op) {
  var g = '<g opacity="' + (op == null ? 1 : op) + '">';
  var rectW = size * 0.6;
  var rectH = size * 0.8;
  var triSize = size * 0.4;
  var d = '';

  g += rrect(x, y, rectW, rectH, size * 0.1, col, op);

  if (direction === 'up') {
    d = "M " + (x - triSize/2) + " " + (y - rectH/2 - triSize/4) + " L " + x + " " + (y - rectH/2 - triSize) + " L " + (x + triSize/2) + " " + (y - rectH/2 - triSize/4) + " Z";
  } else if (direction === 'down') {
    d = "M " + (x - triSize/2) + " " + (y + rectH/2 + triSize/4) + " L " + x + " " + (y + rectH/2 + triSize) + " L " + (x + triSize/2) + " " + (y + rectH/2 + triSize/4) + " Z";
  } else if (direction === 'left') {
    d = "M " + (x - rectW/2 - triSize/4) + " " + (y - triSize/2) + " L " + (x - rectW/2 - triSize) + " " + y + " L " + (x - rectW/2 - triSize/4) + " " + (y + triSize/2) + " Z";
  } else if (direction === 'right') {
    d = "M " + (x + rectW/2 + triSize/4) + " " + (y - triSize/2) + " L " + (x + rectW/2 + triSize) + " " + y + " L " + (x + rectW/2 + triSize/4) + " " + (y + triSize/2) + " Z";
  }
  g += '<path d="' + d + '" fill="' + col + '" opacity="' + (op == null ? 1 : op) + '"/>';
  g += '</g>';
  return g;
}

/* Camera transform */
function camera(scale, tx, ty) {
  return 'transform="translate(' + (CX + tx) + ' ' + (CY + ty) + ') scale(' + scale + ') translate(' + (-CX) + ' ' + (-CY) + ')"';
}

/* =====================================================================
   SCENES — inner markup for #stage at local time u in [0,1]
   ===================================================================== */

// Global grid parameters for persistence and morphing
var GRID_W = 800, GRID_H = 1400;
var GRID_ROWS = 6, GRID_COLS = 4;
var GRID_X = CX, GRID_Y = CY;
var LANE_WIDTH = 100;

/* SCENE 1 (0-10): YOU + NEED */
function scene1(u) {
  var s = '';
  var scale = lerp(1.06, 1.0, smooth(u * 0.9));
  var driftY = lerp(-24, 0, smooth(u * 0.9));
  s += '<g ' + camera(scale, 0, driftY) + '>';

  var gridOp = ramp(u, 0.0, 0.3);
  s += cityGrid(GRID_X, GRID_Y, GRID_W, GRID_H, GRID_ROWS, GRID_COLS, WHITE, 8, 0.2 + 0.8 * gridOp);

  // Amber car moving left-to-right
  var carStartY = CY + 100;
  var carX = lerp(CX - GRID_W/2 - 150, CX + GRID_W/2 + 150, easeOut(u));
  var carY = carStartY;
  s += car(carX, carY, AMBER, 1);

  s += '</g>';
  return s;
}

/* SCENE 2 (10-20): GO */
function scene2(u) {
  var s = '';
  var scale = 1.0;
  var camX = lerp(0, -100, smooth(ramp(u, 0.6, 1.0))); // Pan to show destination
  var camY = lerp(0, -100, smooth(ramp(u, 0.6, 1.0)));
  s += '<g ' + camera(scale, camX, camY) + '>';

  s += cityGrid(GRID_X, GRID_Y, GRID_W, GRID_H, GRID_ROWS, GRID_COLS, WHITE, 8, 1);

  var carStartY = CY + 100;
  var carStartX = CX - GRID_W/2 + LANE_WIDTH/2;
  var carStopX = carStartX + GRID_W/GRID_COLS; // At the intersection
  var carGoX = carStopX + GRID_W/GRID_COLS; // After turning
  var carGoY = carStartY + GRID_H/GRID_ROWS; // New path Y

  var carX = lerp(carStartX, carStopX, smooth(ramp(u, 0.0, 0.2)));
  var carY = carStartY;
  var carOp = 1;

  // One-way sign appears
  var signX = carStopX + LANE_WIDTH/2; // Centered on the lane
  var signY = carStartY;
  var signOp = ramp(u, 0.2, 0.3);
  s += oneWayArrow(signX, signY, 80, 'right', CORAL, signOp);

  // Destination dot
  var destX = signX + LANE_WIDTH/2;
  var destY = signY;
  s += dot(destX, destY, 20, WHITE, ramp(u, 0.6, 0.8));

  // Car turns
  var turnPhase = ramp(u, 0.4, 0.8);
  if (turnPhase > 0) {
    var turnX = lerp(carStopX, carGoX, easeOut(turnPhase));
    var turnY = lerp(carStartY, carGoY, easeOut(turnPhase));
    // Draw a path for the turn
    var d = "M " + carStopX + " " + carStartY +
            " Q " + (carStopX + 50) + " " + (carStartY + 50) + " " + turnX + " " + turnY;
    s += pathTag(d, AMBER, 8, 0.6);
    carX = turnX;
    carY = turnY;
  }

  s += car(carX, carY, AMBER, carOp);

  s += '</g>';
  return s;
}

/* SCENE 3 (20-30): SEARCH */
function scene3(u) {
  var s = '';
  var scale = lerp(1.0, 0.8, smooth(u)); // Zoom out slightly
  var camX = lerp(-100, 0, smooth(u));
  var camY = lerp(-100, 0, smooth(u));
  s += '<g ' + camera(scale, camX, camY) + '>';

  s += cityGrid(GRID_X, GRID_Y, GRID_W, GRID_H, GRID_ROWS, GRID_COLS, WHITE, 8, 1);

  // Amber car on a longer, indirect path
  var carPathStartX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var carPathStartY = CY + 100 + GRID_H/GRID_ROWS;
  var carPathMidX = carPathStartX + GRID_W/GRID_COLS;
  var carPathMidY = carPathStartY;
  var carPathEndX = carPathMidX;
  var carPathEndY = carPathMidY - GRID_H/GRID_ROWS; // Back to initial row

  var carX, carY;
  var pathSeg1 = ramp(u, 0.0, 0.4);
  var pathSeg2 = ramp(u, 0.4, 0.8);

  if (pathSeg1 < 1) {
    carX = lerp(carPathStartX, carPathMidX, easeOut(pathSeg1));
    carY = carPathStartY;
  } else {
    carX = carPathMidX;
    carY = lerp(carPathMidY, carPathEndY, easeOut(pathSeg2));
  }
  s += car(carX, carY, AMBER, 1);

  // Previous intersection highlighted in coral red, with erratic lines
  var intersectionX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var intersectionY = CY + 100;
  var messOp = ramp(u, 0.1, 0.7) * (1 - ramp(u, 0.8, 1.0));

  if (messOp > 0.02) {
    s += rrect(intersectionX, intersectionY, LANE_WIDTH * 2, LANE_WIDTH * 2, 20, CORAL, 0.15 * messOp);
    s += ring(intersectionX, intersectionY, LANE_WIDTH * 1.2, CORAL, 6, 0.5 * messOp);

    // Erratic lines
    for (var i = 0; i < 8; i++) {
      var r = rnd(i + 10) * LANE_WIDTH * 0.8;
      var angle1 = rnd(i) * Math.PI * 2;
      var angle2 = rnd(i + 1) * Math.PI * 2;
      var x1 = intersectionX + Math.cos(angle1) * r;
      var y1 = intersectionY + Math.sin(angle1) * r;
      var x2 = intersectionX + Math.cos(angle2) * r;
      var y2 = intersectionY + Math.sin(angle2) * r;
      s += line(x1, y1, x2, y2, CORAL, 5, 0.8 * messOp * (0.5 + 0.5 * Math.sin(u * 10 + i)));
    }
  }

  s += '</g>';
  return s;
}

/* SCENE 4 (30-40): FIND */
function scene4(u) {
  var s = '';
  var scale = lerp(0.8, 1.0, smooth(u)); // Zoom back in
  s += '<g ' + camera(scale, 0, 0) + '>';

  // Coral red mess dissolves
  var messFade = 1 - ramp(u, 0.0, 0.2);
  var intersectionX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var intersectionY = CY + 100;
  if (messFade > 0.02) {
    s += rrect(intersectionX, intersectionY, LANE_WIDTH * 2, LANE_WIDTH * 2, 20, CORAL, 0.15 * messFade);
    s += ring(intersectionX, intersectionY, LANE_WIDTH * 1.2, CORAL, 6, 0.5 * messFade);
  }

  // Grid transforms to show multiple one-way streets, all flowing in clear, signal blue directions.
  var blueFade = ramp(u, 0.2, 0.5);
  s += cityGrid(GRID_X, GRID_Y, GRID_W, GRID_H, GRID_ROWS, GRID_COLS, WHITE, 8, 1 - blueFade); // Base grid fades out

  // Blue one-way lanes emerge
  var streetSW = 10;
  var streetOp = 0.3 + 0.7 * blueFade;
  var arrowOp = blueFade;

  var colStep = GRID_W / GRID_COLS;
  var rowStep = GRID_H / GRID_ROWS;
  var startX = GRID_X - GRID_W / 2;
  var startY = GRID_Y - GRID_H / 2;

  // Vertical lanes (alternating directions)
  for (var i = 0; i <= GRID_COLS; i++) {
    var laneX = startX + i * colStep;
    s += line(laneX, startY, laneX, startY + GRID_H, BLUE, streetSW, streetOp);
    var arrowDir = (i % 2 === 0) ? 'down' : 'up';
    for (var j = 0; j < GRID_ROWS; j++) {
      s += oneWayArrow(laneX, startY + j * rowStep + rowStep / 2, 40, arrowDir, BLUE, arrowOp);
    }
  }
  // Horizontal lanes (alternating directions)
  for (var j = 0; j <= GRID_ROWS; j++) {
    var laneY = startY + j * rowStep;
    s += line(startX, laneY, startX + GRID_W, laneY, BLUE, streetSW, streetOp);
    var arrowDir = (j % 2 === 0) ? 'right' : 'left';
    for (var i = 0; i < GRID_COLS; i++) {
      s += oneWayArrow(startX + i * colStep + colStep / 2, laneY, 40, arrowDir, BLUE, arrowOp);
    }
  }

  // Amber car is now one of many flowing in an organized manner.
  var carX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var carY = CY + 100 + GRID_H/GRID_ROWS;
  s += car(carX, carY, AMBER, 1);

  // Other blue cars (dots) flowing
  for (var k = 0; k < 6; k++) {
    var flowU = (u * 0.8 + rnd(k)) % 1;
    var otherCarX = CX - GRID_W/2 + LANE_WIDTH/2 + (k % 2) * GRID_W/GRID_COLS * 2;
    var otherCarY = lerp(BOT, TOP, flowU);
    s += dot(otherCarX, otherCarY, 15, BLUE, blueFade);
  }

  s += '</g>';
  return s;
}

/* SCENE 5 (40-50): TAKE */
function scene5(u) {
  var s = '';
  var scale = lerp(1.0, 0.9, smooth(u));
  var camY = lerp(0, 50, smooth(u)); // Focus on car's path
  s += '<g ' + camera(scale, 0, camY) + '>';

  // Blue one-way lanes (persistent from previous scene)
  var streetSW = 10;
  var streetOp = 1;

  var colStep = GRID_W / GRID_COLS;
  var rowStep = GRID_H / GRID_ROWS;
  var startX = GRID_X - GRID_W / 2;
  var startY = GRID_Y - GRID_H / 2;

  for (var i = 0; i <= GRID_COLS; i++) {
    var laneX = startX + i * colStep;
    s += line(laneX, startY, laneX, startY + GRID_H, BLUE, streetSW, streetOp);
    var arrowDir = (i % 2 === 0) ? 'down' : 'up';
    for (var j = 0; j < GRID_ROWS; j++) {
      s += oneWayArrow(laneX, startY + j * rowStep + rowStep / 2, 40, arrowDir, BLUE, streetOp);
    }
  }
  for (var j = 0; j <= GRID_ROWS; j++) {
    var laneY = startY + j * rowStep;
    s += line(startX, laneY, startX + GRID_W, laneY, BLUE, streetSW, streetOp);
    var arrowDir = (j % 2 === 0) ? 'right' : 'left';
    for (var i = 0; i < GRID_COLS; i++) {
      s += oneWayArrow(startX + i * colStep + colStep / 2, laneY, 40, arrowDir, BLUE, streetOp);
    }
  }

  // Amber car completing its longer path
  var carPath = [];
  var initialCarX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var initialCarY = CY + 100 + GRID_H/GRID_ROWS;
  carPath.push({x: initialCarX, y: initialCarY}); // Start
  carPath.push({x: initialCarX + GRID_W/GRID_COLS, y: initialCarY}); // Turn 1
  carPath.push({x: initialCarX + GRID_W/GRID_COLS, y: initialCarY - GRID_H/GRID_ROWS}); // Turn 2
  carPath.push({x: initialCarX + GRID_W/GRID_COLS * 2, y: initialCarY - GRID_H/GRID_ROWS}); // Turn 3
  carPath.push({x: initialCarX + GRID_W/GRID_COLS * 2, y: initialCarY - GRID_H/GRID_ROWS * 2}); // Destination

  var pathLen = carPath.length - 1;
  var currentSegment = Math.min(pathLen - 1, Math.floor(u * pathLen));
  var segmentU = (u * pathLen) % 1;

  var carX = lerp(carPath[currentSegment].x, carPath[currentSegment + 1].x, smooth(segmentU));
  var carY = lerp(carPath[currentSegment].y, carPath[currentSegment + 1].y, smooth(segmentU));

  // Draw the full path as a faint trail
  var trailD = "M " + carPath[0].x + " " + carPath[0].y;
  for (var i = 1; i < carPath.length; i++) {
    trailD += " L " + carPath[i].x + " " + carPath[i].y;
  }
  s += pathTag(trailD, AMBER, 6, 0.2);

  s += car(carX, carY, AMBER, 1);

  // Destination dot
  var destX = carPath[carPath.length - 1].x;
  var destY = carPath[carPath.length - 1].y;
  s += dot(destX, destY, 20, WHITE, ramp(u, 0.8, 1.0));

  // Other blue traffic continues to flow around it.
  for (var k = 0; k < 6; k++) {
    var flowU = (u * 0.6 + rnd(k)) % 1;
    var otherCarX = CX - GRID_W/2 + LANE_WIDTH/2 + (k % 2) * GRID_W/GRID_COLS * 2;
    var otherCarY = lerp(BOT, TOP, flowU);
    s += dot(otherCarX, otherCarY, 15, BLUE, 0.6);
  }

  s += '</g>';
  return s;
}

/* SCENE 6 (50-60): RETURN + CHANGE */
function scene6(u) {
  var s = '';
  var scale = lerp(0.9, 1.0, smooth(u));
  var camY = lerp(50, 0, smooth(u));
  s += '<g ' + camera(scale, 0, camY) + '>';

  // Entire city grid visible in signal blue, showing the optimized flow.
  var streetSW = 10;
  var streetOp = 1;

  var colStep = GRID_W / GRID_COLS;
  var rowStep = GRID_H / GRID_ROWS;
  var startX = GRID_X - GRID_W / 2;
  var startY = GRID_Y - GRID_H / 2;

  for (var i = 0; i <= GRID_COLS; i++) {
    var laneX = startX + i * colStep;
    s += line(laneX, startY, laneX, startY + GRID_H, BLUE, streetSW, streetOp);
    var arrowDir = (i % 2 === 0) ? 'down' : 'up';
    for (var j = 0; j < GRID_ROWS; j++) {
      s += oneWayArrow(laneX, startY + j * rowStep + rowStep / 2, 40, arrowDir, BLUE, streetOp);
    }
  }
  for (var j = 0; j <= GRID_ROWS; j++) {
    var laneY = startY + j * rowStep;
    s += line(startX, laneY, startX + GRID_W, laneY, BLUE, streetSW, streetOp);
    var arrowDir = (j % 2 === 0) ? 'right' : 'left';
    for (var i = 0; i < GRID_COLS; i++) {
      s += oneWayArrow(startX + i * colStep + colStep / 2, laneY, 40, arrowDir, BLUE, streetOp);
    }
  }

  // Amber car drives on a street, now with a clear understanding.
  var carX = CX - GRID_W/2 + LANE_WIDTH/2 + GRID_W/GRID_COLS;
  var carY = CY + 100 + GRID_H/GRID_ROWS;
  var carMove = lerp(0, GRID_W/GRID_COLS, smooth(u));
  s += car(carX + carMove, carY, AMBER, 1);

  // Many other cars (dots)
  for (var k = 0; k < 10; k++) {
    var flowU = (u * 0.7 + rnd(k)) % 1;
    var otherCarX = CX - GRID_W/2 + LANE_WIDTH/2 + (Math.floor(rnd(k+10) * GRID_COLS)) * GRID_W/GRID_COLS;
    var otherCarY = lerp(BOT, TOP, flowU);
    s += dot(otherCarX, otherCarY, 15, BLUE, 0.7);
  }

  // Final frame stable >= 0.8s, so keep elements stable towards u=1.
  // The car continues to move, showing ongoing flow.

  s += '</g>';
  return s;
}

var SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

/* ---------- master render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  var idx = Math.min(5, Math.floor(t / 10));
  var u = (t - idx * 10) / 10;
  if (t >= DUR) { idx = 5; u = 1; } // Ensure last frame is stable at u=1
  document.getElementById("stage").innerHTML = SCENES[idx](u);
}

/* ---------- boot / seek API ---------- */
window.__seek = function (s) { render(s); };
function boot() { render(0); window.__ready = true; }
if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
  document.fonts.ready.then(boot);
  setTimeout(function () { if (!window.__ready) boot(); }, 1500); // Fallback for slow font loading
} else { boot(); }

if (!window.__recording) {
  var start = null;
  function tick(ts) {
    if (start == null) start = ts;
    render(((ts - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
